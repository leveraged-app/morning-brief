<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<title>Leveraged: Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0D12;--card:#131820;--card2:#1A202B;--ink:#F3F5F8;--muted:#98A1B0;--line:#252D3A;--line2:#2F3846;
--g:#3DDC97;--g2:#2BBF80;--gd:#1A8A5B;--red:#FF6B5E;--redd:#C2433A;--gold:#E3B341;--goldd:#A87F1F;--blue:#6EA8FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto;padding:14px 16px 150px}
.appbar{display:flex;align-items:center;padding:4px 2px 4px}
.brand2{display:flex;align-items:center;gap:8px;font-family:Geist,Inter,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.2px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,13,18,.86);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;min-height:48px;justify-content:center;text-decoration:none;color:#7D8594;font-size:11px;font-weight:600}
.tabbar a.on{color:var(--ink)}.tabbar a.on svg{color:var(--g)}

/* top stats */
.stats{display:flex;align-items:center;gap:8px;margin:10px 0 4px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.stat{font-family:'Geist Mono',Geist,monospace;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:7px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px}
.flame{color:#FF8A3D}.flame.off{color:#59606C}
.bolt{color:var(--blue)}
.goal{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.25}
.ring{width:38px;height:38px}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line2)}.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}

/* path */
.unit-banner{border-radius:20px;padding:16px 18px;margin:22px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.unit-banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--uc)}
.unit-banner .u{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--uc)}
.unit-banner .n{font-family:Geist,Inter,sans-serif;font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.unit-banner .c{font-size:13px;font-weight:700;color:var(--muted);background:var(--card2);border:1px solid var(--line2);padding:5px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:62px 0 8px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:70px;height:66px;border-radius:50%;border:0;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.node svg{width:28px;height:28px}
.node.todo{background:var(--card2);box-shadow:0 6px 0 #0F131A,inset 0 0 0 1px var(--line2);color:#4D5563}
.node.done{background:#E9EDF2;box-shadow:0 6px 0 #9AA3B2;color:#0A0D12}
.node.cur{background:var(--c);box-shadow:0 6px 0 var(--cd);color:#06140E}
.node:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.node.cur::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);opacity:.35;animation:pulse 1.8s ease-out infinite}
.bubble{position:absolute;top:-46px;background:var(--card2);border:1px solid var(--line2);color:var(--c);font-weight:800;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;letter-spacing:1px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--card2);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.node-label{margin-top:12px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;max-width:150px;line-height:1.3}
.node-label.cur{color:var(--ink)}
.mascot-side{position:absolute;width:92px;top:38%;pointer-events:none;opacity:.95}

/* lesson */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.x{width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:12px;display:flex;align-items:center;justify-content:center}
.prog{flex:1;height:14px;border-radius:999px;background:var(--card2);overflow:hidden;position:relative;border:1px solid var(--line)}
.prog>div{height:100%;background:var(--g);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1);position:relative}
.prog>div::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:999px;background:rgba(255,255,255,.35)}
.combo{font-weight:800;color:#FF8A3D;font-size:14px;display:flex;align-items:center;gap:4px;min-width:44px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.kicker{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--g);text-transform:uppercase}
.qrow{display:flex;gap:12px;align-items:flex-end;margin:8px 0 18px}
.qrow .m{width:74px;flex-shrink:0}
.speech{position:relative;flex:1;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px 16px;font-family:Geist,Inter,sans-serif;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.2px}
.speech::before{content:"";position:absolute;left:-8px;bottom:22px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;padding:12px 14px;border-radius:16px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0F131A;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s;animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0F131A}
.opt .k{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0}
.opt.sel{border-color:var(--g);background:rgba(61,220,151,.08);box-shadow:0 4px 0 var(--gd)}
.opt.sel .k{border-color:var(--g);color:var(--g)}
.opt.right{border-color:var(--g);background:rgba(61,220,151,.14);box-shadow:0 4px 0 var(--gd);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.opt.wrong{border-color:var(--red);background:rgba(255,107,94,.12);box-shadow:0 4px 0 var(--redd);animation:shake .4s}
.opt:disabled{cursor:default}
.hintbtn{background:none;border:0;color:var(--g);font-weight:700;font-size:14px;padding:10px 0;cursor:pointer}
.hint{font-size:14px;color:var(--muted);margin:0 0 10px;animation:rise .3s backwards}
textarea{width:100%;min-height:130px;border:1px solid var(--line2);border-radius:16px;padding:12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--g)}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.model{background:var(--card);border:1px solid rgba(61,220,151,.45);border-radius:16px;padding:12px 14px;font-size:14px;margin:12px 0 0;animation:rise .35s backwards}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px calc(18px + env(safe-area-inset-bottom));z-index:10;transition:background .2s}
.foot .in{max-width:620px;margin:0 auto}
.foot.ok{background:#0F2A1F;border-color:#1D4A36;animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
.foot.bad{background:#2A1514;border-color:#4A2422;animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
.verdict{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin:0 0 4px}
.verdict .badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#06140E}
.foot.ok .verdict{color:var(--g)}.foot.ok .badge{background:var(--g)}
.foot.bad .verdict{color:var(--red)}.foot.bad .badge{background:var(--red);color:#2A0705}
.exp{font-size:14px;margin:0 0 12px;line-height:1.5;color:#D6DBE3}
.btn{width:100%;min-height:54px;border:0;border-radius:16px;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:var(--g);color:#06140E;box-shadow:0 5px 0 var(--gd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}
.btn:disabled{background:var(--card2);color:#59606C;box-shadow:0 5px 0 #0F131A;cursor:default;transform:none}
.btn.red{background:var(--red);color:#2A0705;box-shadow:0 5px 0 var(--redd)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2);box-shadow:0 5px 0 #0F131A}
.row{display:flex;gap:10px}.row .btn{flex:1}

.float-xp{position:fixed;font-weight:800;font-size:20px;color:var(--blue);pointer-events:none;z-index:30;animation:floatup 1s ease-out forwards}
.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;font-weight:800;color:#FF8A3D;z-index:30;animation:toast 1.4s ease forwards;white-space:nowrap}

/* finish */
.done-card{text-align:center;padding:24px 4px 10px}
.done-card .m{width:140px;margin:0 auto;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.done-card h1{font-family:Geist,Inter,sans-serif;font-size:30px;margin:14px 0 4px;color:var(--g);letter-spacing:-.5px}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0 18px}
.stars svg{width:44px;height:44px;opacity:0;transform:scale(.3)}
.stars svg.on{animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
.stars svg.off{animation:starin .5s forwards;filter:grayscale(1) brightness(.45)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}
.chip{border-radius:16px;border:1px solid var(--line2);overflow:hidden;background:var(--card)}
.chip .h{color:var(--cc);font-size:10px;font-weight:800;letter-spacing:1.2px;padding:10px 0 0;text-transform:uppercase}
.chip .v{font-family:'Geist Mono',Geist,monospace;font-size:24px;font-weight:700;padding:2px 0 12px;color:var(--ink);font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* the bull: eyes change colour with mood */
.bull{--eye:#3DDC97;overflow:visible}
.bull .eye{fill:var(--eye);transition:fill .2s}
.bull .glow{fill:var(--eye);opacity:.0;transition:opacity .25s}
.bull.happy{--eye:#3DDC97;animation:nod .55s cubic-bezier(.2,1.4,.4,1)}
.bull.happy .glow,.bull.wow .glow{opacity:.35}
.bull.wow{--eye:#7FF0C0}
.bull.sad{--eye:#FF8A5C;animation:shake .45s}
.bull.idle{animation:breathe 4s ease-in-out infinite}

@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.35);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes nod{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes starin{to{opacity:1;transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(-4deg)}}
.flame:not(.off) svg{animation:flicker 1.2s ease-in-out infinite;transform-origin:50% 90%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.lesson-pad{padding-bottom:320px}
</style>
</head>
