function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k==="style") n.setAttribute("style",v);
    else if(k==="html") n.innerHTML=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) n.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
}
function svg(markup){const t=document.createElement("template");t.innerHTML=markup.trim();return t.content.firstChild}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function yesterdayStr(){const y=new Date();y.setDate(y.getDate()-1);return todayStr(y)}
function liveStreak(){return (S.last===todayStr()||S.last===yesterdayStr())?S.streak:0}
function dailyXP(){return S.daily&&S.daily.date===todayStr()?S.daily.xp:0}
function addXP(n){S.xp+=n; if(!S.daily||S.daily.date!==todayStr()) S.daily={date:todayStr(),xp:0}; S.daily.xp+=n;}
function bumpStreak(){const t=todayStr(); if(S.last===t) return false; S.streak=(S.last===yesterdayStr())?S.streak+1:1; S.last=t; return true;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function countUp(node,from,to,ms){ if(reduceMotion){node.textContent=to;return} const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/ms);const e=1-Math.pow(1-p,3);node.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0);}

// ---------- sound (tiny synth, no files) ----------
let AC=null;
function tone(freqs,dur,type,gain){ if(!S.sound) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime;
  freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*dur);g.gain.linearRampToValueAtTime(gain||.12,t+i*dur+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur*1.6);
    o.connect(g);g.connect(AC.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*1.8);});
}catch(e){} }
const sfx={
  tap:()=>tone([520],.05,"triangle",.05),
  right:()=>tone([660,880],.09,"triangle",.13),
  wrong:()=>tone([220,180],.12,"sawtooth",.05),
  combo:()=>tone([660,880,1100],.07,"triangle",.12),
  done:()=>tone([523,659,784,1046],.12,"triangle",.14)
};

function setMood(node,mood){ if(!node) return; node.classList.remove("idle","happy","sad","wow","neutral"); void node.getBoundingClientRect(); node.classList.add(mood); }

// ---------- confetti ----------
function confetti(){
  if(reduceMotion) return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");
  c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=["#3DDC97","#6EA8FF","#E3B341","#FF9A5C","#B28CFF","#F3F5F8"];
  const P=Array.from({length:160},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,
    w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(t-t0<3200) requestAnimationFrame(f); else x.clearRect(0,0,innerWidth,innerHeight);})(t0);
}
function floatXP(n,anchor){
  const r=anchor.getBoundingClientRect();
  const f=el("div",{class:"float-xp",style:`left:${r.left+r.width/2}px;top:${r.top-10}px`},"+"+n+" XP");
  document.body.append(f); setTimeout(()=>f.remove(),1100);
}
function toast(text){const t=el("div",{class:"toast",role:"status"},text);document.body.append(t);setTimeout(()=>t.remove(),1500)}

// ---------- shared header ----------
function header(){
  return el("div",{class:"appbar"},el("div",{class:"brand2"},
    el("span",{class:"logo","aria-hidden":"true",html:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg>'}),"Leveraged"));
}

  const I={today:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
    learn:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg>',
    archive:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>'};
  const a=(href,label,key,on)=>el("a",{href,class:on?"on":"","aria-current":on?"page":false,html:I[key]+label});
  return el("nav",{class:"tabbar","aria-label":"Main"},el("div",{class:"in"},a("index.html","Today","today"),a("learn.html","Learn","learn",true),a("archive.html","Archive","archive")));
}
function statsBar(){
  const st=liveStreak(), d=Math.min(dailyXP(),DAILY_GOAL), C=2*Math.PI*16;
  const ring=svg(`<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="bgc" cx="20" cy="20" r="16"/>
    <circle class="fg" cx="20" cy="20" r="16" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 20 20)"/></svg>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>ring.querySelector(".fg").style.strokeDashoffset=C*(1-d/DAILY_GOAL)));
  const xpNum=el("span",{},"0"); countUp(xpNum,0,S.xp,900);
  const snd=el("button",{class:"icon-btn",type:"button","aria-label":S.sound?"Turn sound off":"Turn sound on","aria-pressed":S.sound?"true":"false",
    onclick:()=>{S.sound=!S.sound;save();home(true)},html:S.sound?ICON.sound:ICON.mute});
  return el("div",{class:"stats"},
    el("div",{class:"stat flame"+(st?"":" off"),title:"Day streak"},svg(ICON.flame),el("span",{},String(st)),el("span",{class:"sr",style:"position:absolute;left:-9999px"},"day streak")),
    el("div",{class:"stat bolt",title:"Total XP"},svg(ICON.bolt),xpNum,el("span",{style:"position:absolute;left:-9999px"},"XP")),
    el("div",{class:"goal"},ring,el("span",{},d+"/"+DAILY_GOAL+" XP",el("br",{}),"daily goal")),

// ---------- home: the path ----------
const OFFS=[0,62,92,62,0,-62,-92,-62];
function home(keepScroll){
  const y=window.scrollY; app.classList.remove('lesson-pad');
  app.replaceChildren(header(), statsBar());
  let curSet=false, nodeIndex=0, curNode=null;
  DATA.forEach((u,ui)=>{
    const [c,cd]=UNIT_COLORS[ui%UNIT_COLORS.length];
    const done=u.lessons.filter(l=>S.done[l.id]).length;
    app.append(el("div",{class:"unit-banner",style:`--uc:${c}`},
      el("div",{},el("div",{class:"u"},"UNIT "+u.unit),el("div",{class:"n"},u.title)),
      el("div",{class:"c"},done+" / "+u.lessons.length)));
    const path=el("div",{class:"path",style:`--c:${c};--cd:${cd}`});
    u.lessons.forEach((l,i)=>{
      const isDone=!!S.done[l.id]; let state="todo";
      if(isDone) state="done"; else if(!curSet){state="cur"; curSet=true;}
      const off=OFFS[nodeIndex%OFFS.length]; nodeIndex++;
      const btn=el("button",{class:"node "+state,type:"button","aria-label":`${l.title}, ${isDone?"completed":state==="cur"?"start":"not started"}`,
        onclick:()=>{sfx.tap();startLesson(u,l,c,cd)},html:state==="done"?ICON.check:state==="cur"?ICON.play:ICON.star.replace('fill="#E3B341" stroke="#A87F1F"','fill="currentColor" stroke="none"')});
      const w=el("div",{class:"node-wrap",style:`transform:translateX(${off}px)`},
        state==="cur"?el("div",{class:"bubble","aria-hidden":"true"},done===0&&ui===0?"START":"NEXT UP"):null,
        btn, el("div",{class:"node-label"+(state==="cur"?" cur":"")},l.title));
      if(state==="cur"){curNode=w;}
      if(i===2){ const m=bull("idle"); m.classList.add("mascot-side"); m.setAttribute("style",`${off>0?"left":"right"}:2%;`); path.append(m); }
      path.append(w);
    });
    app.append(path);
  });
  app.append(el("footer",{},"Progress is saved on this device. For education only, not investment advice."), tabbar());
  if(keepScroll) window.scrollTo(0,y);
  else if(curNode) setTimeout(()=>curNode.scrollIntoView({block:"center",behavior:reduceMotion?"auto":"smooth"}),150);
}

// ---------- lesson ----------
let L=null;
function startLesson(u,l,c,cd){
  L={u,l,c,cd,queue:l.questions.map(q=>({q,tries:0})),total:l.questions.length,doneCount:0,firstTry:0,xp:0,combo:0,best:0,picked:null,checked:false,t0:Date.now()};
  renderQ();
}
function renderQ(){
  const item=L.queue[0], q=item.q; app.classList.add('lesson-pad');
  L.picked=null; L.checked=false;
  if(q.options && !item.order) item.order=shuffle(q.options.map((t,i)=>i));
  const combo=el("div",{class:"combo","aria-live":"polite"}, L.combo>=2?[svg(ICON.flame),String(L.combo)]:"");
  combo.querySelector&&combo.querySelector("svg")&&combo.querySelector("svg").setAttribute("style","width:18px;height:18px");
  app.replaceChildren(el("div",{class:"top"},
    el("button",{class:"x",type:"button","aria-label":"Quit lesson",onclick:()=>home(),html:ICON.x}),
    el("div",{class:"prog",role:"progressbar","aria-label":"Lesson progress","aria-valuemin":"0","aria-valuemax":String(L.total),"aria-valuenow":String(L.doneCount)},
      el("div",{style:`width:${Math.max(4,Math.round(L.doneCount/L.total*100))}%`})),
    combo));
  const mascot=bull("idle");
  app.append(el("div",{class:"kicker"},(item.tries?"Try again · ":"")+q.step),
    el("div",{class:"qrow"},el("div",{class:"m"},mascot),el("div",{class:"speech"},q.q)));
  const foot=el("div",{class:"foot"}); const fin=el("div",{class:"in"}); foot.append(fin);

  if(q.options){
    const list=el("div",{class:"opts",role:"radiogroup","aria-label":"Answer choices"});
    item.order.forEach((oi,pos)=>{
      const b=el("button",{class:"opt",type:"button",role:"radio","aria-checked":"false",style:`animation-delay:${pos*60}ms`,onclick:()=>{
        if(L.checked) return; L.picked=oi; sfx.tap();
        list.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});
        b.classList.add("sel"); b.setAttribute("aria-checked","true"); check.disabled=false; setMood(mascot,"wow");
      }}, el("span",{class:"k"},String(pos+1)), q.options[oi]);
      b.dataset.i=oi; list.append(b);
    });
    app.append(list);
    if(q.hint){
      const h=el("p",{class:"hint",hidden:true},"Hint: "+q.hint);
      app.append(el("button",{class:"hintbtn",type:"button",onclick:(e)=>{h.hidden=false;e.target.remove()}},"Need a hint?"),h);
    }
    const check=el("button",{class:"btn",type:"button",disabled:true,onclick:()=>{
      if(!L.checked){
        L.checked=true; const right=L.picked===q.answer;
        list.querySelectorAll(".opt").forEach(x=>{x.disabled=true; const i=+x.dataset.i;
          if(i===q.answer) x.classList.add("right"); else if(i===L.picked) x.classList.add("wrong");});
        foot.className="foot "+(right?"ok":"bad");
        let gained=0;
        if(right){ gained=item.tries===0?10:5; L.xp+=gained; if(item.tries===0)L.firstTry++; L.combo++; L.best=Math.max(L.best,L.combo);
          sfx.right(); setMood(mascot,"happy"); floatXP(gained,list.querySelector(".opt.right"));
          if(L.combo===3||L.combo===5||L.combo===8){ setTimeout(()=>{sfx.combo();toast(L.combo+" in a row!")},250); }
        } else { L.combo=0; sfx.wrong(); setMood(mascot,"sad"); if(navigator.vibrate) navigator.vibrate(60); }
        const praise=["Nice!","Great job!","Exactly!","You got it!","Nailed it!"];
        fin.prepend(el("div",{class:"verdict"},el("span",{class:"badge",html:right?ICON.check:ICON.x.replace('width="26" height="26"','width="18" height="18"')}),
            right?(item.tries===0?praise[Math.floor(Math.random()*praise.length)]:"Got it this time!"):"Not quite"),
          el("p",{class:"exp"},q.exp));
        check.textContent="Continue"; if(!right) check.classList.add("red");
        setTimeout(()=>{const r=list.querySelector('.opt.right'); if(r){const fb=foot.getBoundingClientRect().top, rb=r.getBoundingClientRect().bottom; if(rb>fb-12) window.scrollBy({top:rb-fb+24,behavior:reduceMotion?'auto':'smooth'});}},320);
        L.lastRight=right;
      } else { next(L.lastRight); }
    }},"Check");
    fin.append(check);
  } else {
    app.append(el("label",{class:"lbl",for:"ans"},"Say it out loud, or type your answer"),
               el("textarea",{id:"ans",placeholder:"Your answer…"}));
    if(q.hint) app.append(el("p",{class:"hint"},"Tip: "+q.hint));
    const reveal=el("button",{class:"btn",type:"button",onclick:()=>{
      sfx.tap(); setMood(mascot,"wow");
      app.append(el("div",{class:"model"},el("b",{},"Model answer: "),q.exp.replace(/^Model answer( structure)?[^:]*:\s*/i,"")));
      fin.replaceChildren(el("div",{class:"row"},
        el("button",{class:"btn ghost",type:"button",onclick:(e)=>{L.xp+=5;floatXP(5,e.currentTarget);sfx.right();setTimeout(()=>next(true),350)}},"Needs work"),
        el("button",{class:"btn",type:"button",onclick:(e)=>{L.xp+=10;L.firstTry++;L.combo++;floatXP(10,e.currentTarget);sfx.right();setTimeout(()=>next(true),350)}},"Nailed it")));
      setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:reduceMotion?"auto":"smooth"}),50);
    }},"Show model answer");
    fin.append(reveal);
  }
  app.append(foot);
  window.scrollTo(0,0);
}
function next(right){
  const item=L.queue.shift();
  if(right) L.doneCount++; else { item.tries++; L.queue.push(item); }
  if(L.queue.length) renderQ(); else finish();
}
function finish(){
  app.classList.remove('lesson-pad');
  const bonus=20; L.xp+=bonus;
  const before=dailyXP(); addXP(L.xp); S.done[L.l.id]=true; const newDay=bumpStreak(); save();
  const acc=Math.round(L.firstTry/L.total*100);
  const stars=acc>=90?3:acc>=60?2:1;
  const secs=Math.round((Date.now()-L.t0)/1000), time=Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0");
  const starRow=el("div",{class:"stars","aria-label":stars+" of 3 stars"});
  for(let i=0;i<3;i++){const s=svg(ICON.star);s.classList.add(i<stars?"on":"off");s.style.animationDelay=(300+i*220)+"ms";starRow.append(s);}
  const xpV=el("div",{class:"v"},"0"), accV=el("span",{},"0"), timeV=el("div",{class:"v"},time);
  const m=bull("happy");
  app.replaceChildren(header(), el("div",{class:"done-card"},
    el("div",{class:"m"},m),
    el("h1",{},stars===3?"Perfect lesson!":"Lesson complete!"),
    starRow,
    el("div",{class:"chips"},
      el("div",{class:"chip",style:"--cc:#6EA8FF"},el("div",{class:"h"},"Total XP"),xpV),
      el("div",{class:"chip",style:"--cc:#3DDC97"},el("div",{class:"h"},"Accuracy"),el("div",{class:"v"},accV,"%")),
      el("div",{class:"chip",style:"--cc:#FF9A5C"},el("div",{class:"h"},"Time"),timeV)),
    newDay?el("p",{style:"font-weight:800;color:#FF8A3D;margin:0 0 8px"},liveStreak()+"-day streak!"):null,
    (before<DAILY_GOAL && dailyXP()>=DAILY_GOAL)?el("p",{style:"font-weight:800;color:#E3B341;margin:0 0 8px"},"Daily goal reached!"):null),
    el("button",{class:"btn",type:"button",onclick:()=>home()},"Continue"));
  sfx.done(); confetti();
  setTimeout(()=>{countUp(xpV,0,L.xp,900);countUp(accV,0,acc,900)},250);
  window.scrollTo(0,0);
}
home();
</script>
