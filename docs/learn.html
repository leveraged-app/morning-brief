<script>
const DATA = [{"unit": 0, "title": "How markets move", "lessons": [{"id": "u0l1", "title": "Interest rates and central banks", "questions": [{"id": "U0-1.1", "step": "Concept", "q": "What does a central bank like the Bank of Canada or the Fed mainly control?", "exp": "Central banks set a short-term policy rate (the overnight rate in Canada, the federal funds rate in the US). That rate ripples out to mortgages, loans and savings rates across the economy.", "hint": null, "options": ["The price of stocks", "A short-term policy interest rate", "The price of oil", "Corporate taxes"], "answer": 1}, {"id": "U0-1.2", "step": "Concept", "q": "Why would a central bank raise interest rates?", "exp": "Higher rates make loans and mortgages cost more, so people and businesses borrow and spend less. Less spending takes pressure off prices.", "hint": "What happens when borrowing gets expensive?", "options": ["To speed up the economy", "To slow down inflation by making borrowing more expensive", "To make the stock market go up", "To weaken its own currency"], "answer": 1}, {"id": "U0-1.3", "step": "Concept", "q": "Why do higher interest rates usually hurt stock valuations?", "exp": "A stock is worth the present value of its future cash flows. A higher discount rate shrinks that present value. Borrowing also gets more expensive for companies.", "hint": "Think about a DCF.", "options": ["Future cash flows get discounted at a higher rate, so they're worth less today", "Companies stop paying taxes", "Higher rates always cause recessions immediately", "Stocks pay interest"], "answer": 0}, {"id": "U0-1.4", "step": "Single step", "q": "The Bank of Canada unexpectedly cuts rates. What usually happens to the Canadian dollar?", "exp": "Lower rates make Canadian bonds and savings less attractive to global investors, so demand for the loonie falls and it usually weakens.", "hint": null, "options": ["It strengthens", "It weakens", "Nothing", "It's pegged, so it can't move"], "answer": 1}, {"id": "U0-1.5", "step": "Spot it", "q": "Which sector often benefits from higher interest rates?", "exp": "Banks can often earn a wider spread between what they charge on loans and what they pay on deposits. Utilities, real estate and growth stocks tend to suffer, because they rely on borrowing or on cash flows far in the future.", "hint": null, "options": ["Banks", "Utilities", "Real estate", "Fast-growing tech"], "answer": 0}]}, {"id": "u0l2", "title": "Bond yields", "questions": [{"id": "U0-2.1", "step": "Concept", "q": "When bond prices go up, what happens to their yields?", "exp": "A bond pays fixed coupons. If you pay more for the bond, those same payments are a smaller return on your money, so the yield falls. Price and yield move in opposite directions.", "hint": null, "options": ["Yields go up", "Yields go down", "Yields stay the same", "It depends on the stock market"], "answer": 1}, {"id": "U0-2.2", "step": "Concept", "q": "Why do people watch the 10-year government bond yield so closely?", "exp": "The 10-year yield affects mortgage rates and corporate borrowing, and it's a building block for discount rates. When it moves, valuations across markets move too.", "hint": null, "options": ["It's a benchmark for borrowing costs and for valuing stocks", "It's the central bank's policy rate", "It measures inflation directly", "It only matters to bond traders"], "answer": 0}, {"id": "U0-2.3", "step": "Calculate", "q": "The 10-year yield rises from 4.10% to 4.25%. How many basis points is that?", "exp": "One basis point is 0.01%. A move of 0.15% equals 15 basis points.", "hint": "1 bp = 0.01%.", "options": ["1.5 bps", "15 bps", "150 bps", "0.15 bps"], "answer": 1}, {"id": "U0-2.4", "step": "Concept", "q": "What does an inverted yield curve mean?", "exp": "Normally investors demand more to lend for longer, so long-term yields are higher. When short-term yields go above long-term ones, it often signals investors expect rate cuts and a slowdown. It has come before many past recessions.", "hint": null, "options": ["Short-term yields are higher than long-term yields", "Long-term yields are higher than short-term yields", "All yields are zero", "Stocks are yielding more than bonds"], "answer": 0}, {"id": "U0-2.5", "step": "Single step", "q": "Stocks sell off hard and investors rush to safety. What usually happens to government bond yields?", "exp": "Investors buy safe government bonds, which pushes bond prices up and yields down.", "hint": "Remember: price up, yield down.", "options": ["They rise", "They fall", "They don't move", "They turn negative"], "answer": 1}]}, {"id": "u0l3", "title": "Oil and commodities", "questions": [{"id": "U0-3.1", "step": "Single step", "q": "OPEC+ announces it will cut oil production. What usually happens to oil prices?", "exp": "Less supply with the same demand pushes prices up.", "hint": null, "options": ["They rise", "They fall", "No change", "They go to zero"], "answer": 0}, {"id": "U0-3.2", "step": "Spot it", "q": "Oil drops 10%. Which of these is usually hurt the most?", "exp": "Producers earn less on every barrel they sell. Airlines, truckers and drivers all benefit, because fuel is one of their costs.", "hint": null, "options": ["Airlines", "Canadian oil and gas producers", "Trucking companies", "Consumers buying gas"], "answer": 1}, {"id": "U0-3.3", "step": "Concept", "q": "Why does the TSX often react more to oil prices than the S&P 500 does?", "exp": "Energy is one of the TSX's biggest sectors, while it's a much smaller slice of the S&P 500. So swings in oil move the Canadian index more.", "hint": null, "options": ["Energy companies make up a much bigger share of the TSX", "The TSX is priced in barrels of oil", "Canada doesn't have tech companies", "The S&P 500 doesn't include energy companies"], "answer": 0}, {"id": "U0-3.4", "step": "Concept", "q": "Why do oil prices matter for inflation?", "exp": "Higher oil means higher gas prices and higher transport and production costs, which spread to other prices. Cheaper oil does the opposite.", "hint": null, "options": ["Oil feeds into gas, shipping and the cost of making many goods", "Oil is part of the central bank's policy rate", "Oil prices are set by the government", "They don't affect inflation"], "answer": 0}, {"id": "U0-3.5", "step": "Concept", "q": "When does gold often rise?", "exp": "Gold pays no interest, so it looks better when interest rates after inflation are low. Investors also buy it as a safe store of value when they're worried.", "hint": null, "options": ["When investors are nervous or when real interest rates fall", "Only when stocks are rising", "When interest rates rise sharply", "Gold never changes price"], "answer": 0}]}, {"id": "u0l4", "title": "Currencies and the loonie", "questions": [{"id": "U0-4.1", "step": "Concept", "q": "USD/CAD goes from 1.35 to 1.40. What happened to the Canadian dollar?", "exp": "USD/CAD is how many Canadian dollars it takes to buy one US dollar. Needing 1.40 instead of 1.35 means the loonie buys less, so it weakened.", "hint": "More CAD per USD means...", "options": ["It strengthened", "It weakened", "No change", "It was revalued by the government"], "answer": 1}, {"id": "U0-4.2", "step": "Calculate", "q": "USD/CAD is 1.40. You buy something that costs US$100. How much is that in Canadian dollars?", "exp": "Multiply by the rate: 100 × 1.40 = C$140.", "hint": null, "options": ["C$71.43", "C$100", "C$140", "C$114"], "answer": 2}, {"id": "U0-4.3", "step": "Concept", "q": "Why does the Canadian dollar often move with oil prices?", "exp": "When oil is expensive, buyers need more Canadian dollars to pay for Canadian oil, and money flows into the country. That tends to lift the loonie.", "hint": null, "options": ["Oil is a major Canadian export, so higher oil means more demand for Canadian dollars", "The Canadian dollar is backed by oil", "The Bank of Canada sets oil prices", "It doesn't, they're unrelated"], "answer": 0}, {"id": "U0-4.4", "step": "Spot it", "q": "Who usually benefits from a weaker Canadian dollar?", "exp": "Exporters earn US dollars, which convert into more Canadian dollars when the loonie is weak. Travellers and importers pay more.", "hint": null, "options": ["Canadians travelling to the US", "Canadian exporters that sell in US dollars", "Canadian importers", "Nobody"], "answer": 1}, {"id": "U0-4.5", "step": "Single step", "q": "The Bank of Canada cuts rates while the Fed holds steady. What usually happens to USD/CAD?", "exp": "The gap between US and Canadian rates widens in favour of the US, so investors prefer US dollars. The loonie weakens, and USD/CAD goes up.", "hint": null, "options": ["It rises (the loonie weakens)", "It falls (the loonie strengthens)", "No change", "It goes to 1.00"], "answer": 0}]}, {"id": "u0l5", "title": "Earnings season", "questions": [{"id": "U0-5.1", "step": "Spot it", "q": "On earnings day, which numbers do investors usually compare to analysts' estimates first?", "exp": "Headlines focus on whether EPS and revenue beat or missed the consensus estimate.", "hint": null, "options": ["Earnings per share and revenue", "The number of employees", "The share count", "The dividend date"], "answer": 0}, {"id": "U0-5.2", "step": "Concept", "q": "What is guidance?", "exp": "Guidance is what the company expects for upcoming quarters or the year. Markets often care about it more than the results just reported.", "hint": null, "options": ["Management's forecast for future results", "A rule from the stock exchange", "A rating from a credit agency", "Last quarter's results"], "answer": 0}, {"id": "U0-5.3", "step": "Concept", "q": "A company beats its earnings estimates, but the stock falls. What's the most likely reason?", "exp": "Prices reflect expectations. If investors expected a big beat, or the company lowered its outlook, the stock can drop even on good numbers.", "hint": null, "options": ["Weak guidance, or results that weren't as strong as investors hoped", "Stocks always fall on earnings day", "The company paid too much tax", "Beating estimates is bad news"], "answer": 0}, {"id": "U0-5.4", "step": "Concept", "q": "When Canadian banks report, why do investors watch provisions for credit losses closely?", "exp": "Rising provisions mean the bank expects more borrowers to struggle. That's both a hit to profit and a read on the wider economy.", "hint": null, "options": ["It's money set aside for loans that might not be repaid, so it signals how borrowers are doing", "It's the bank's dividend", "It's how much the bank paid its executives", "It's the bank's share buyback"], "answer": 0}]}, {"id": "u0l6", "title": "Economic data", "questions": [{"id": "U0-6.1", "step": "Concept", "q": "What does CPI measure?", "exp": "CPI tracks how much prices for things like food, rent and gas are rising. It's the main inflation number central banks watch.", "hint": null, "options": ["Changes in the prices of a basket of everyday goods and services (inflation)", "Total output of the economy", "The unemployment rate", "Company profits"], "answer": 0}, {"id": "U0-6.2", "step": "Single step", "q": "Inflation (CPI) comes in hotter than expected. What's the most likely market reaction?", "exp": "Higher inflation means the central bank may keep rates higher for longer, which pushes yields up and weighs on stock valuations.", "hint": null, "options": ["Bond yields rise and stocks often fall, because rate cuts look less likely", "Bond yields fall and stocks rally", "Nothing happens", "Oil prices automatically rise"], "answer": 0}, {"id": "U0-6.3", "step": "Concept", "q": "Why do markets sometimes fall on a very strong jobs report?", "exp": "This is the 'good news is bad news' effect. If the economy looks hot, investors expect fewer rate cuts.", "hint": null, "options": ["A strong economy can mean the central bank keeps rates higher for longer", "Investors dislike low unemployment", "Jobs reports are always wrong", "Strong jobs mean companies will lose money"], "answer": 0}, {"id": "U0-6.4", "step": "Concept", "q": "What is a common rule of thumb for a recession?", "exp": "GDP measures the total value of goods and services an economy produces. Two straight quarters of decline is the popular shorthand, though official calls look at more data.", "hint": null, "options": ["Two quarters in a row of falling GDP", "Any month the stock market falls", "Inflation above 2%", "When the central bank raises rates"], "answer": 0}, {"id": "U0-6.5", "step": "Say it out loud", "q": "How would a Bank of Canada rate cut affect the TSX?", "exp": "Model answer: A cut lowers borrowing costs and discount rates, which usually supports stock valuations, especially rate-sensitive sectors like real estate and utilities. It also tends to weaken the loonie, which helps exporters. Banks can be mixed: cheaper borrowing can support loan growth and credit quality, but margins can get squeezed. The reaction also depends on expectations. If the cut was already priced in, or it signals the economy is weak, the market might not rally.", "hint": "Valuations, the loonie, then sectors."}, {"id": "U0-6.6", "step": "Say it out loud", "q": "Tell me about something happening in the markets right now and why it matters.", "exp": "Model answer structure (use today's brief): 1) What happened, with a number, e.g. 'oil fell about 3% yesterday.' 2) Why it happened, e.g. 'expectations of more supply.' 3) Why it matters: who wins and loses, like energy producers vs airlines, and what it means for inflation, rates or deals. 4) What you're watching next, e.g. 'the next OPEC+ meeting.' Keep it under a minute and show a view, not just a headline.", "hint": "What, why, so what, what's next."}]}]}, {"unit": 1, "title": "Accounting", "lessons": [{"id": "u1l1", "title": "The income statement", "questions": [{"id": "U1-1.1", "step": "Concept", "q": "What does the income statement show?", "exp": "The income statement covers a period, like a quarter or a year, and ends at net income. The balance sheet is the one that shows a single day.", "hint": "Think 'over a period' vs 'on one day'.", "options": ["A company's revenue, expenses and profit over a period of time", "What a company owns and owes on one specific day", "All the cash that came in and went out", "How the company's share price has changed"], "answer": 0}, {"id": "U1-1.2", "step": "Spot it", "q": "Which of these is NOT on the income statement?", "exp": "Inventory is an asset on the balance sheet. It only reaches the income statement as cost of goods sold once the products are sold.", "hint": "Which one is something the company owns?", "options": ["Cost of goods sold", "Interest expense", "Inventory", "Income tax expense"], "answer": 2}, {"id": "U1-1.3", "step": "Calculate", "q": "Revenue is $100, COGS is $40, operating expenses are $30 and interest expense is $10. The tax rate is 25%. What is net income?", "exp": "Operating income is 100 − 40 − 30 = $30. Subtract $10 of interest for pre-tax income of $20. Tax is 25% × 20 = $5, so net income is $15.", "hint": "Work down the statement: operating income, then pre-tax income, then tax.", "options": ["$15", "$20", "$22.50", "$30"], "answer": 0}, {"id": "U1-1.4", "step": "Concept", "q": "Why doesn't a $100 equipment purchase show up as a $100 expense on the income statement?", "exp": "Equipment helps the company for many years, so its cost is expensed gradually through depreciation instead of all at once. The purchase itself shows up on the cash flow statement as capex.", "hint": "How long does equipment help the business?", "options": ["It's a long-lived asset, so its cost is spread out over time as depreciation", "Equipment purchases are never tax-deductible", "It's counted as negative revenue instead", "Companies can choose to leave it off entirely"], "answer": 0}, {"id": "U1-1.5", "step": "Spot it", "q": "Which of these is a non-cash expense?", "exp": "Depreciation lowers profit, but no cash leaves the company that year. The cash left when the asset was bought.", "hint": "Which one doesn't involve paying anyone this year?", "options": ["Salaries", "Rent", "Depreciation", "Interest on a loan"], "answer": 2}, {"id": "U1-1.6", "step": "Concept", "q": "What is EBITDA?", "exp": "EBITDA is a rough measure of operating profit that ignores how a company is financed (interest), taxes and non-cash D&A. That makes it easy to compare companies.", "hint": "Each letter is something it comes 'before'.", "options": ["Earnings before interest, taxes, depreciation and amortization", "Earnings after all expenses and taxes", "Total revenue before any costs", "Cash left after paying for capex"], "answer": 0}]}, {"id": "u1l2", "title": "The balance sheet", "questions": [{"id": "U1-2.1", "step": "Concept", "q": "What does the balance sheet show?", "exp": "The balance sheet is a snapshot of assets, liabilities and equity at a single point in time, like the last day of the quarter.", "hint": null, "options": ["Revenue and expenses for the year", "What a company owns, owes and the owners' stake on one specific day", "Cash coming in and going out", "A list of the company's customers"], "answer": 1}, {"id": "U1-2.2", "step": "Concept", "q": "Which equation is always true on the balance sheet?", "exp": "Everything a company owns (assets) was paid for either by borrowing (liabilities) or by the owners (equity). So both sides must always match.", "hint": "Where does the money to buy assets come from?", "options": ["Assets = Liabilities + Equity", "Assets = Revenue − Expenses", "Equity = Assets + Liabilities", "Liabilities = Assets + Cash"], "answer": 0}, {"id": "U1-2.3", "step": "Spot it", "q": "Which of these is a liability?", "exp": "Deferred revenue is cash a customer paid before the company delivered the product. The company owes them the product, so it's a liability. The other three are assets.", "hint": "Which one means the company still owes the customer something?", "options": ["Accounts receivable", "Deferred revenue", "Prepaid expenses", "Inventory"], "answer": 1}, {"id": "U1-2.4", "step": "Concept", "q": "What does accounts receivable mean?", "exp": "The company made the sale and recorded the revenue, but the customer hasn't paid yet. It's an asset because that cash is coming in.", "hint": null, "options": ["Money the company owes its suppliers", "Cash customers paid in advance", "Money customers owe the company for sales already recorded", "Cash sitting in the bank"], "answer": 2}, {"id": "U1-2.5", "step": "Concept", "q": "A gym collects $120 for a 12-month membership up front. Right after collecting, how is this recorded?", "exp": "The gym has the cash but hasn't delivered the service yet, so it records deferred revenue. Each month it earns $10, moving $10 from deferred revenue into revenue.", "hint": "Has the gym earned it yet?", "options": ["$120 of revenue right away", "$120 of deferred revenue (a liability)", "$120 of accounts receivable", "Nothing until the year ends"], "answer": 1}, {"id": "U1-2.6", "step": "Spot it", "q": "Which balance sheet item does net income flow into?", "exp": "Net income adds to retained earnings, which is part of equity. Dividends paid out come off retained earnings.", "hint": "It's the 'kept profits' account.", "options": ["Cash", "Common stock", "Retained earnings", "Accounts payable"], "answer": 2}]}, {"id": "u1l3", "title": "The cash flow statement", "questions": [{"id": "U1-3.1", "step": "Concept", "q": "Why do we need a cash flow statement if we already have net income?", "exp": "Things like depreciation and changes in receivables or inventory make profit and cash different. The cash flow statement shows how much cash actually came in and went out.", "hint": null, "options": ["Net income includes non-cash items and timing differences, so it isn't the same as cash", "Net income is only used for tax purposes", "The cash flow statement shows the share price", "Net income is always higher than cash"], "answer": 0}, {"id": "U1-3.2", "step": "Spot it", "q": "What are the three sections of the cash flow statement?", "exp": "Operating is cash from running the business, investing is buying or selling long-term assets like equipment, and financing is debt, shares and dividends.", "hint": null, "options": ["Revenue, expenses, taxes", "Operating, investing, financing", "Assets, liabilities, equity", "Current, long-term, other"], "answer": 1}, {"id": "U1-3.3", "step": "Spot it", "q": "Where does buying new equipment (capex) show up on the cash flow statement?", "exp": "Capex is spending on long-term assets, so it goes in cash flow from investing.", "hint": null, "options": ["Operating", "Investing", "Financing", "It doesn't show up"], "answer": 1}, {"id": "U1-3.4", "step": "Single step", "q": "Accounts receivable goes up by $20. What happens to cash flow from operations?", "exp": "The company recorded $20 of sales but hasn't collected the cash yet. On the cash flow statement you subtract the increase, so operating cash flow falls $20.", "hint": "Did the customer actually pay?", "options": ["Up $20", "Down $20", "No change", "Down $15"], "answer": 1}, {"id": "U1-3.5", "step": "Spot it", "q": "Which of these is a financing activity?", "exp": "Dividends go to shareholders, so they're financing. Buying a factory is investing; collecting from customers and paying taxes are operating.", "hint": null, "options": ["Buying a factory", "Collecting from customers", "Paying a dividend", "Paying income taxes"], "answer": 2}, {"id": "U1-3.6", "step": "Concept", "q": "Why do we add depreciation back on the cash flow statement?", "exp": "Net income already had depreciation subtracted. Since it's non-cash, you add it back to get to real cash.", "hint": null, "options": ["It lowered net income, but no cash actually left the company", "Depreciation is a type of revenue", "To make cash flow look bigger", "Because depreciation is paid at year end"], "answer": 0}]}, {"id": "u1l4", "title": "Linking the 3 statements", "questions": [{"id": "U1-4.1", "step": "Concept", "q": "Where does the ending cash from the cash flow statement go?", "exp": "Beginning cash plus the net change in cash from the cash flow statement gives ending cash, which is the cash line on the balance sheet.", "hint": null, "options": ["Revenue on the income statement", "Cash on the balance sheet", "Retained earnings", "It doesn't go anywhere"], "answer": 1}, {"id": "U1-4.2", "step": "Concept", "q": "How is ending retained earnings calculated?", "exp": "Profits the company keeps add to retained earnings, and profits paid to shareholders as dividends come off.", "hint": null, "options": ["Beginning retained earnings + net income − dividends", "Revenue − expenses", "Assets − liabilities − cash", "Beginning retained earnings + dividends"], "answer": 0}, {"id": "U1-4.3", "step": "Single step", "q": "A company pays a $5 dividend. What happens?", "exp": "Dividends aren't an expense, so the income statement doesn't change. Cash goes down $5 in financing, and retained earnings go down $5, so the balance sheet still balances.", "hint": "Is a dividend an expense?", "options": ["Net income falls $5", "Cash falls $5 and retained earnings fall $5; the income statement is unaffected", "Cash falls $5 and debt rises $5", "Nothing, dividends are optional"], "answer": 1}, {"id": "U1-4.4", "step": "Concept", "q": "If you could only look at one statement to judge a company's health, which do interviewers usually expect you to pick?", "exp": "The cash flow statement shows how much real cash the business generates and where it goes, which is hard to fake. Mention why you'd still want the others.", "hint": "Which one shows real cash?", "options": ["Income statement", "Balance sheet", "Cash flow statement", "None, you always need all three"], "answer": 2}, {"id": "U1-4.5", "step": "Say it out loud", "q": "Walk me through how the three financial statements link together.", "exp": "Model answer: Net income from the bottom of the income statement is the first line of the cash flow statement. You adjust it for non-cash items like depreciation and for changes in working capital to get cash from operations, then add investing and financing cash flows to get the net change in cash. That change plus beginning cash is the cash on the balance sheet. Net income also flows into retained earnings in equity, and the other balance sheet changes, like PP&E from capex and depreciation, or debt from borrowing, match lines on the cash flow statement. That's why assets still equal liabilities plus equity.", "hint": "Start at net income and follow the cash."}]}, {"id": "u1l5", "title": "Single-step changes", "questions": [{"id": "U1-5.1", "step": "Single step", "q": "Depreciation goes up by $10. The tax rate is 25%. What happens to net income?", "exp": "Pre-tax income falls $10, which lowers taxes by 25% × 10 = $2.50. So net income falls 10 − 2.50 = $7.50.", "hint": "Taxes go down too.", "options": ["Down $10", "Down $7.50", "Down $2.50", "No change"], "answer": 1}, {"id": "U1-5.2", "step": "Single step", "q": "Same change: depreciation up $10, 25% tax rate. What happens to cash?", "exp": "Net income is down $7.50, but you add back the $10 of depreciation because it's non-cash. −7.50 + 10 = +$2.50. Cash rises because the company pays less tax.", "hint": "Start with net income, then add back the non-cash part.", "options": ["Down $10", "Down $7.50", "Up $2.50", "No change"], "answer": 2}, {"id": "U1-5.3", "step": "Single step", "q": "Same change: depreciation up $10, 25% tax rate. How does the balance sheet still balance?", "exp": "Assets fall $7.50 in total (PP&E −10, cash +2.50). On the other side, net income was down $7.50, so retained earnings and equity fall $7.50. Both sides drop by the same amount.", "hint": null, "options": ["PP&E down $10 and cash up $2.50, so assets are down $7.50; retained earnings down $7.50", "Cash down $10 and debt down $10", "PP&E up $10 and equity up $10", "Only cash changes"], "answer": 0}, {"id": "U1-5.4", "step": "Single step", "q": "A company buys $100 of equipment with cash. What happens on the income statement right away?", "exp": "Nothing on the income statement yet. Cash falls $100 in investing, and PP&E rises $100 on the balance sheet. The cost hits the income statement later through depreciation.", "hint": null, "options": ["Expenses up $100", "Net income down $75", "Nothing", "Revenue down $100"], "answer": 2}, {"id": "U1-5.5", "step": "Single step", "q": "A company buys $10 of inventory with cash and hasn't sold it yet. What happens to cash flow from operations?", "exp": "Buying inventory uses cash, and it shows up as an increase in inventory under working capital, so operating cash flow is down $10. Nothing hits the income statement until it's sold.", "hint": null, "options": ["Up $10", "Down $10", "No change", "Down $7.50"], "answer": 1}, {"id": "U1-5.6", "step": "Single step", "q": "A company borrows $50 of new debt. What happens before any interest is paid?", "exp": "Borrowing isn't income. Cash rises $50 in financing, and debt rises $50 as a liability, so the balance sheet balances. Interest expense comes later.", "hint": null, "options": ["Net income up $50", "Cash up $50 and debt up $50; no change to the income statement", "Cash up $50 and equity up $50", "Nothing"], "answer": 1}, {"id": "U1-5.7", "step": "Say it out loud", "q": "Walk me through the three statements when depreciation goes up by $10. Assume a 25% tax rate.", "exp": "Model answer: On the income statement, pre-tax income falls $10, and at a 25% tax rate net income falls $7.50. On the cash flow statement, net income is down $7.50, but you add back the $10 of depreciation since it's non-cash, so cash is up $2.50. On the balance sheet, cash is up $2.50 and PP&E is down $10, so assets are down $7.50. Retained earnings are down $7.50 from the lower net income, so liabilities plus equity are also down $7.50 and it balances.", "hint": "Go income statement, then cash flow, then balance sheet."}]}, {"id": "u1l6", "title": "Multi-step scenarios", "questions": [{"id": "U1-6.1", "step": "Multi-step", "q": "A company buys $50 of inventory on credit (accounts payable). What happens to cash?", "exp": "Inventory up $50 lowers operating cash flow by $50, but accounts payable up $50 raises it by $50. Net change in cash is zero. On the balance sheet, inventory and AP are both up $50.", "hint": "The company hasn't paid anyone yet.", "options": ["Down $50", "Up $50", "No change", "Down $37.50"], "answer": 2}, {"id": "U1-6.2", "step": "Multi-step", "q": "It then sells all of that inventory for $80 in cash. Tax rate is 25%. What is net income from the sale?", "exp": "Revenue is $80 and COGS is $50, so pre-tax income is $30. Tax is 25% × 30 = $7.50, so net income is $22.50.", "hint": "Revenue minus COGS, then tax.", "options": ["$80", "$30", "$22.50", "$60"], "answer": 2}, {"id": "U1-6.3", "step": "Multi-step", "q": "From that $80 sale alone, how much does cash change?", "exp": "Start with net income of $22.50, then add $50 because inventory went down. That's +$72.50. Quick check: $80 collected minus $7.50 of tax = $72.50.", "hint": "The company collected $80 but paid some tax.", "options": ["Up $80", "Up $72.50", "Up $22.50", "Up $30"], "answer": 1}, {"id": "U1-6.4", "step": "Multi-step", "q": "A company borrows $100 at 10% interest and uses it to buy equipment that depreciates evenly over 10 years. Tax rate is 25%. What happens to net income in year 1?", "exp": "Interest is 10% × 100 = $10 and depreciation is 100 ÷ 10 = $10, so pre-tax income falls $20. After 25% tax, net income falls $15.", "hint": "Two expenses: interest and depreciation.", "options": ["Down $20", "Down $15", "Down $10", "Down $7.50"], "answer": 1}, {"id": "U1-6.5", "step": "Multi-step", "q": "Same deal, year 1, counting the borrowing and the purchase. No debt is repaid yet. What is the net change in cash?", "exp": "Operating: net income −15 + depreciation 10 = −5. Investing: −100 for the equipment. Financing: +100 from the debt. Total: −5.", "hint": "Add up all three sections.", "options": ["Down $5", "Down $15", "Down $105", "No change"], "answer": 0}, {"id": "U1-6.6", "step": "Say it out loud", "q": "Walk me through the three statements when a company writes down $20 of inventory. Assume a 25% tax rate.", "exp": "Model answer: On the income statement, the $20 write-down is an expense, so pre-tax income falls $20 and net income falls $15. On the cash flow statement, net income is down $15, and you add back the $20 because the write-down is non-cash, so cash is up $5 from lower taxes. On the balance sheet, cash is up $5 and inventory is down $20, so assets are down $15. Retained earnings are down $15, so both sides fall by $15 and it balances.", "hint": "It works just like depreciation."}]}]}, {"unit": 2, "title": "Equity value & EV", "lessons": [{"id": "u2l1", "title": "Equity value", "questions": [{"id": "U2-1.1", "step": "Concept", "q": "What does equity value (market cap) measure?", "exp": "Equity value is share price × diluted shares outstanding. It's only the shareholders' piece, so lenders and other investors aren't included.", "hint": "Whose stake is 'equity'?", "options": ["The value of the whole business to every investor, including lenders", "The value of the company that belongs to its shareholders", "The company's total cash", "The value of the company's assets on the balance sheet"], "answer": 1}, {"id": "U2-1.2", "step": "Calculate", "q": "A company has 50 shares outstanding and its share price is $20. Ignoring options, what is its equity value?", "exp": "Equity value = share price × shares = $20 × 50 = $1,000.", "hint": null, "options": ["$70", "$250", "$1,000", "$2,000"], "answer": 2}, {"id": "U2-1.3", "step": "Concept", "q": "Why do bankers use market equity value instead of book equity from the balance sheet?", "exp": "Book equity is built from past accounting entries, like money raised and profits kept. Market value is what the shares actually trade for, based on expectations about the future.", "hint": null, "options": ["Market value reflects what investors think future cash flows are worth today; book equity is based on historical accounting", "Book equity is always zero", "Market value never changes", "Book equity includes debt"], "answer": 0}, {"id": "U2-1.4", "step": "Spot it", "q": "Which of these can be negative?", "exp": "Book equity goes negative after big losses, or when a company returns more cash through buybacks and dividends than it has earned. Market equity value can't go below zero, because a share price can't.", "hint": null, "options": ["Market equity value", "Book equity (shareholders' equity on the balance sheet)", "Share price", "Number of shares outstanding"], "answer": 1}]}, {"id": "u2l2", "title": "Enterprise value", "questions": [{"id": "U2-2.1", "step": "Concept", "q": "What does enterprise value measure?", "exp": "Enterprise value is the value of the operating business itself, no matter how it's financed. That's why it's used with metrics like EBITDA that belong to every investor.", "hint": null, "options": ["The value of the company's core business to all investors, including lenders and shareholders", "Only the shareholders' stake", "The company's cash minus its debt", "The value of the company's brand"], "answer": 0}, {"id": "U2-2.2", "step": "Concept", "q": "A house is worth $500,000 and has a $400,000 mortgage. Which number is like enterprise value?", "exp": "The full $500,000 price of the house is like enterprise value. Your $100,000 stake after the mortgage is like equity value.", "hint": "What would a buyer pay for the house itself?", "options": ["$100,000", "$400,000", "$500,000", "$900,000"], "answer": 2}, {"id": "U2-2.3", "step": "Calculate", "q": "Equity value is $1,000, debt is $300 and cash is $100. What is enterprise value?", "exp": "Enterprise value = equity value + debt − cash = 1,000 + 300 − 100 = $1,200.", "hint": "Add debt, subtract cash.", "options": ["$1,200", "$1,400", "$800", "$1,300"], "answer": 0}, {"id": "U2-2.4", "step": "Concept", "q": "Why do you subtract cash when calculating enterprise value?", "exp": "Enterprise value is meant to value the operating business. Extra cash sitting on the balance sheet is a non-operating asset, so you take it out.", "hint": null, "options": ["Cash isn't part of the core business, and a buyer effectively gets it back", "Cash is a liability", "Cash is already counted twice", "Because companies always spend all their cash"], "answer": 0}, {"id": "U2-2.5", "step": "Single step", "q": "A company borrows $100 and keeps it all as cash. What happens to enterprise value?", "exp": "Debt goes up $100 and cash goes up $100, so they cancel out. The core business didn't change, so neither did enterprise value. Equity value doesn't change either.", "hint": "Add debt, subtract cash.", "options": ["Up $100", "Down $100", "No change", "Up $200"], "answer": 2}, {"id": "U2-2.6", "step": "Single step", "q": "A company uses $50 of cash to pay off $50 of debt. What happens to enterprise value?", "exp": "Debt falls $50 and cash falls $50, so enterprise value stays the same. Changing how a company is financed doesn't change what the business is worth.", "hint": null, "options": ["Up $50", "Down $50", "No change", "Down $100"], "answer": 2}, {"id": "U2-2.7", "step": "Single step", "q": "A company issues $100 of new shares and keeps the cash. The share price doesn't move. What happens?", "exp": "More shares at the same price means equity value rises $100. But cash also rises $100, which you subtract, so enterprise value stays the same.", "hint": null, "options": ["Equity value up $100, enterprise value up $100", "Equity value up $100, enterprise value no change", "Equity value no change, enterprise value up $100", "Neither changes"], "answer": 1}]}, {"id": "u2l3", "title": "Diluted shares", "questions": [{"id": "U2-3.1", "step": "Concept", "q": "Why do we use diluted shares instead of basic shares for equity value?", "exp": "If employees or investors can turn options or convertibles into shares, the company's value is really split among more shares. Diluted shares capture that.", "hint": null, "options": ["Options and convertible securities could turn into shares, splitting ownership further", "Basic shares are always wrong", "Diluted shares are always smaller", "Regulators require it on the income statement"], "answer": 0}, {"id": "U2-3.2", "step": "Spot it", "q": "The share price is $20. Which of these options would you include in diluted shares?", "exp": "Only in-the-money options count, where the strike is below the share price. Nobody would pay $25 for a share worth $20.", "hint": "Would you pay the strike price?", "options": ["Options with a $25 strike price", "Options with a $10 strike price", "Both", "Neither"], "answer": 1}, {"id": "U2-3.3", "step": "Calculate", "q": "A company has 100 basic shares, a $20 share price and 10 options with a $10 strike. Using the treasury stock method, how many diluted shares are there?", "exp": "If all 10 options are exercised, the company gets 10 × $10 = $100. It uses that to buy back $100 ÷ $20 = 5 shares. So net new shares = 10 − 5 = 5, and diluted shares = 105.", "hint": "The option money buys back some shares.", "options": ["110", "105", "100", "95"], "answer": 1}, {"id": "U2-3.4", "step": "Calculate", "q": "200 basic shares, $50 share price and 20 options at a $25 strike. What is diluted equity value?", "exp": "Exercise proceeds are 20 × $25 = $500, which buys back $500 ÷ $50 = 10 shares. Net new shares = 20 − 10 = 10, so diluted shares are 210. Diluted equity value = 210 × $50 = $10,500.", "hint": "First find diluted shares, then multiply by the price.", "options": ["$10,000", "$10,500", "$11,000", "$9,500"], "answer": 1}]}, {"id": "u2l4", "title": "The EV bridge", "questions": [{"id": "U2-4.1", "step": "Spot it", "q": "Going from equity value to enterprise value, which of these do you ADD?", "exp": "You add other investors' claims on the business: debt, preferred stock and noncontrolling interests. You subtract non-operating assets like cash and equity investments.", "hint": "Is it another investor's claim, or an extra asset?", "options": ["Cash", "Preferred stock", "Equity investments in other companies", "None of these"], "answer": 1}, {"id": "U2-4.2", "step": "Spot it", "q": "Going from equity value to enterprise value, which of these do you SUBTRACT?", "exp": "Cash is a non-operating asset, so it comes off. Debt, preferred stock and noncontrolling interests are all added.", "hint": null, "options": ["Debt", "Preferred stock", "Noncontrolling interests", "Cash"], "answer": 3}, {"id": "U2-4.3", "step": "Concept", "q": "Why do you add noncontrolling interests when calculating enterprise value?", "exp": "If a company owns 70% of a subsidiary, it still includes 100% of that subsidiary's EBITDA. Adding the 30% owned by others keeps EV and EBITDA on the same basis.", "hint": "Make the value match the metric.", "options": ["The company reports 100% of a subsidiary's EBITDA even though it owns less, so EV has to include the part it doesn't own", "Noncontrolling interests are a type of cash", "To make the company look bigger", "Because noncontrolling interests are tax-deductible"], "answer": 0}, {"id": "U2-4.4", "step": "Concept", "q": "Why do you subtract equity investments (stakes in companies it doesn't control) when calculating enterprise value?", "exp": "When a company owns a minority stake, say 20%, that company's revenue and EBITDA aren't included in its own. Subtracting the investment keeps EV matched to EBITDA.", "hint": null, "options": ["Their earnings aren't included in the company's EBITDA, so their value shouldn't be in EV either", "They are a type of debt", "They are always worth zero", "Because they're on the income statement"], "answer": 0}, {"id": "U2-4.5", "step": "Calculate", "q": "Equity value $800, debt $300, preferred stock $50, noncontrolling interests $30, cash $100, equity investments $20. What is enterprise value?", "exp": "Add the claims: 800 + 300 + 50 + 30 = 1,180. Subtract non-operating assets: 1,180 − 100 − 20 = $1,060.", "hint": "Add debt, preferred and NCI; subtract cash and investments.", "options": ["$1,060", "$1,300", "$1,180", "$1,100"], "answer": 0}]}, {"id": "u2l5", "title": "Which multiple to use", "questions": [{"id": "U2-5.1", "step": "Concept", "q": "Why is EBITDA paired with enterprise value, not equity value?", "exp": "Match the numerator and the denominator. EBITDA is earned before lenders get paid, so it belongs to all investors, which is enterprise value.", "hint": "Who gets paid out of EBITDA?", "options": ["EBITDA is before interest, so it's available to all investors, and EV is the value to all investors", "Because EBITDA is always bigger than net income", "It's just a tradition with no reason", "Because equity value can't be calculated"], "answer": 0}, {"id": "U2-5.2", "step": "Spot it", "q": "Which metric should be paired with equity value?", "exp": "Net income is after interest has been paid to lenders, so it belongs only to shareholders. That's why P/E uses equity value (share price), not enterprise value.", "hint": null, "options": ["EBITDA", "Revenue", "Net income", "EBIT"], "answer": 2}, {"id": "U2-5.3", "step": "Concept", "q": "Why do bankers often prefer EV/EBITDA over P/E when comparing companies?", "exp": "Two companies with the same business but different amounts of debt will have different net incomes, but similar EBITDA. EV/EBITDA lets you compare the businesses themselves.", "hint": null, "options": ["It isn't affected by how each company is financed or by different tax situations", "It's always a smaller number", "Net income can't be found for public companies", "P/E is illegal to use"], "answer": 0}, {"id": "U2-5.4", "step": "Calculate", "q": "Enterprise value is $1,200 and EBITDA is $150. What is the EV/EBITDA multiple?", "exp": "1,200 ÷ 150 = 8.0x.", "hint": null, "options": ["6.0x", "8.0x", "10.0x", "12.0x"], "answer": 1}, {"id": "U2-5.5", "step": "Say it out loud", "q": "What's the difference between equity value and enterprise value?", "exp": "Model answer: Equity value is the value of the company that belongs to shareholders, so diluted shares times the share price. Enterprise value is the value of the core business to all investors, including lenders and preferred shareholders. To get from equity value to enterprise value, you add debt, preferred stock and noncontrolling interests, and subtract cash and other non-operating assets. Enterprise value goes with metrics before interest, like EBITDA, and equity value goes with metrics after interest, like net income.", "hint": "Who each one belongs to, then the bridge."}, {"id": "U2-5.6", "step": "Say it out loud", "q": "If a company raises debt and keeps the money as cash, what happens to its equity value and enterprise value? Why?", "exp": "Model answer: Neither changes. Equity value stays the same because the share price and share count don't move. Enterprise value also stays the same, because debt goes up and cash goes up by the same amount, and you add one and subtract the other. The core business hasn't changed, only how it's financed.", "hint": null}]}]}, {"unit": 3, "title": "Valuation", "lessons": [{"id": "u3l1", "title": "The main valuation methods", "questions": [{"id": "U3-1.1", "step": "Concept", "q": "What are the three most common ways bankers value a company?", "exp": "Comps look at what similar public companies trade for, precedents look at what buyers paid for similar companies, and a DCF values the company on its own future cash flows.", "hint": null, "options": ["Comparable companies, precedent transactions and a DCF", "Book value, share price and revenue", "Credit rating, dividend yield and market share", "Net income, cash and debt"], "answer": 0}, {"id": "U3-1.2", "step": "Concept", "q": "What's the difference between relative and intrinsic valuation?", "exp": "Comps and precedents are relative: they ask what similar companies are worth. A DCF is intrinsic: it asks what this company's own future cash flows are worth today.", "hint": null, "options": ["Relative compares the company to others; intrinsic values it on its own cash flows", "Relative uses book value; intrinsic uses market value", "They're the same thing", "Intrinsic is only used for private companies"], "answer": 0}, {"id": "U3-1.3", "step": "Spot it", "q": "Which method usually gives the highest value?", "exp": "Precedents reflect what buyers actually paid to take control, which usually includes a premium and expected synergies. That tends to push their values above trading comps. It isn't guaranteed, but it's the usual pattern.", "hint": "What does a buyer pay extra for?", "options": ["Comparable companies", "Precedent transactions", "A DCF", "They always match"], "answer": 1}, {"id": "U3-1.4", "step": "Concept", "q": "Why might a DCF be a poor choice for an early-stage biotech company?", "exp": "A DCF is only as good as its cash flow forecast. If a company may not have positive cash flow for many years, the result depends almost entirely on guesses.", "hint": null, "options": ["Its future cash flows are too uncertain, and often negative for years", "DCFs only work for banks", "Biotech companies have no debt", "A DCF always gives too low a value"], "answer": 0}, {"id": "U3-1.5", "step": "Say it out loud", "q": "How would you value a company?", "exp": "Model answer: I'd use a few methods and compare them. First, comparable companies: find similar public companies and apply their multiples, like EV/EBITDA, to the company's numbers. Second, precedent transactions: look at what buyers paid for similar companies, which usually includes a control premium. Third, a DCF: project the company's cash flows, discount them back at its cost of capital and add a terminal value. Then I'd compare the ranges, often on a football field chart, and explain why they differ.", "hint": "Name the methods, then compare them."}]}, {"id": "u3l2", "title": "Comparable companies", "questions": [{"id": "U3-2.1", "step": "Concept", "q": "How do you choose comparable companies?", "exp": "Good comps are companies investors would see as similar: same kind of business, similar size, growth and profitability, ideally in similar markets.", "hint": null, "options": ["Similar industry, size, growth, margins and geography", "Any companies in the same stock index", "Companies with the same share price", "Companies with the same CEO salary"], "answer": 0}, {"id": "U3-2.2", "step": "Calculate", "q": "Comparable companies trade at a median of 10x EBITDA. Your company's EBITDA is $50. What's its implied enterprise value?", "exp": "Implied EV = multiple × metric = 10 × $50 = $500.", "hint": null, "options": ["$5", "$60", "$500", "$5,000"], "answer": 2}, {"id": "U3-2.3", "step": "Calculate", "q": "Same company: implied enterprise value is $500, and it has $100 of net debt. What's its implied equity value?", "exp": "Equity value = enterprise value − net debt = 500 − 100 = $400.", "hint": "Go back across the EV bridge.", "options": ["$400", "$500", "$600", "$100"], "answer": 0}, {"id": "U3-2.4", "step": "Concept", "q": "Why do bankers often use the median multiple of the comps instead of the average?", "exp": "One outlier, like a company with a temporarily tiny EBITDA, can throw off an average. The median shows what a typical comp trades at.", "hint": null, "options": ["The median isn't skewed by one unusually high or low company", "The median is always higher", "Averages can't be calculated for multiples", "Regulators require it"], "answer": 0}, {"id": "U3-2.5", "step": "Spot it", "q": "You're valuing a large Canadian bank. Which would be the best comparable?", "exp": "The closest comps share the same business model, regulation and market, so another large Canadian bank is the obvious pick.", "hint": null, "options": ["A US airline", "Another large Canadian bank", "A software company", "A gold miner"], "answer": 1}]}, {"id": "u3l3", "title": "Precedent transactions", "questions": [{"id": "U3-3.1", "step": "Concept", "q": "What does a precedent transactions analysis look at?", "exp": "You collect past deals for similar companies and see what multiples the buyers paid, then apply that range to your company.", "hint": null, "options": ["The multiples buyers paid in past acquisitions of similar companies", "The company's own share price history", "Future interest rates", "How much the company paid in dividends"], "answer": 0}, {"id": "U3-3.2", "step": "Concept", "q": "Why are precedent transaction multiples usually higher than trading comps?", "exp": "To buy a whole company, a buyer has to pay shareholders more than the current share price. Buyers will also pay more if they expect cost savings or growth from combining.", "hint": null, "options": ["Buyers pay a control premium and price in expected synergies", "Older deals were always more expensive", "Precedents use revenue instead of EBITDA", "Because they include the target's debt twice"], "answer": 0}, {"id": "U3-3.3", "step": "Concept", "q": "What's a common weakness of precedent transactions?", "exp": "A deal from five years ago happened in a different rate and market environment. There may also be very few truly similar deals.", "hint": null, "options": ["Deals can be old or few, and market conditions may have changed", "They always give the lowest value", "They can't be used for public companies", "They ignore the purchase price"], "answer": 0}, {"id": "U3-3.4", "step": "Calculate", "q": "Similar companies were bought at a median of 12x EBITDA. Your company's EBITDA is $40. What's its implied enterprise value?", "exp": "12 × $40 = $480.", "hint": null, "options": ["$52", "$400", "$480", "$520"], "answer": 2}]}, {"id": "u3l4", "title": "Valuation multiples", "questions": [{"id": "U3-4.1", "step": "Calculate", "q": "A stock trades at $30 and earnings per share are $2. What's its P/E ratio?", "exp": "P/E = share price ÷ EPS = 30 ÷ 2 = 15x. Investors are paying $15 for every $1 of annual earnings.", "hint": null, "options": ["6x", "15x", "28x", "60x"], "answer": 1}, {"id": "U3-4.2", "step": "Spot it", "q": "Which multiple makes the most sense for a fast-growing software company that isn't profitable yet?", "exp": "If EBITDA and net income are negative, those multiples don't mean anything. Revenue is positive, so EV/Revenue is used for early-stage, high-growth companies.", "hint": "Which metric is still positive?", "options": ["P/E", "EV/EBITDA", "EV/Revenue", "Dividend yield"], "answer": 2}, {"id": "U3-4.3", "step": "Concept", "q": "Why might one company trade at a higher multiple than its peers?", "exp": "A multiple reflects what investors expect. Better growth, profitability or stability means investors will pay more for each dollar of earnings today.", "hint": null, "options": ["Faster expected growth, higher margins or lower risk", "It has more employees", "Its share price is higher in dollars", "It pays more tax"], "answer": 0}, {"id": "U3-4.4", "step": "Concept", "q": "Why don't bankers use EV/EBITDA to value banks?", "exp": "Banks borrow and lend as their main business, so you can't separate operations from financing the way EV does. Investors look at P/E and price-to-book value instead.", "hint": null, "options": ["For a bank, debt and interest are part of its core business, so P/E and price-to-book are used instead", "Banks don't report revenue", "Banks have no assets", "EV/EBITDA is only for retailers"], "answer": 0}]}, {"id": "u3l5", "title": "Putting it together", "questions": [{"id": "U3-5.1", "step": "Concept", "q": "What is a football field chart?", "exp": "Each bar shows the low-to-high value from one method, like comps, precedents and the DCF, so you can see where they overlap.", "hint": null, "options": ["A bar chart showing the valuation range from each method side by side", "A chart of the share price over time", "A list of the company's competitors", "A model of sports team revenue"], "answer": 0}, {"id": "U3-5.2", "step": "Concept", "q": "Your DCF value is far above your comps. What would you check first?", "exp": "A DCF is very sensitive to its assumptions. An aggressive growth rate or a low discount rate can push the value well above what the market pays for similar companies.", "hint": null, "options": ["The DCF assumptions, like growth, margins, the discount rate and terminal value", "The company's logo", "Whether the comps pay dividends", "Nothing, the DCF is always right"], "answer": 0}, {"id": "U3-5.3", "step": "Say it out loud", "q": "Which valuation method is the best?", "exp": "Model answer: There isn't one best method, which is why you use several. Comps show what the market pays for similar companies today, but no two companies are identical. Precedents show what buyers paid for control, but deals can be old or rare. A DCF values the company on its own cash flows, but it's very sensitive to assumptions. It also depends on the company: an early-stage company might rely on revenue multiples, while a stable business with predictable cash flows is well suited to a DCF.", "hint": "There's no single answer; explain the trade-offs."}]}]}, {"unit": 4, "title": "DCF", "lessons": [{"id": "u4l1", "title": "DCF basics", "questions": [{"id": "U4-1.1", "step": "Concept", "q": "What does a DCF value a company on?", "exp": "A DCF forecasts the cash a business will generate and works out what that cash is worth in today's dollars.", "hint": null, "options": ["The present value of its expected future cash flows", "Its current share price", "The multiples of similar companies", "Its book value"], "answer": 0}, {"id": "U4-1.2", "step": "Concept", "q": "Why do you discount future cash flows?", "exp": "Money today can be invested and earn a return, and future cash is never guaranteed. Discounting accounts for both.", "hint": null, "options": ["A dollar received later is worth less than a dollar today, because of time and risk", "To make the company look cheaper", "Because of taxes", "Future cash flows are always wrong"], "answer": 0}, {"id": "U4-1.3", "step": "Calculate", "q": "You'll receive $110 in one year. The discount rate is 10%. What's it worth today?", "exp": "Present value = 110 ÷ 1.10 = $100.", "hint": "Divide by (1 + rate).", "options": ["$99", "$100", "$110", "$121"], "answer": 1}, {"id": "U4-1.4", "step": "Concept", "q": "What are the two main pieces of value in a DCF?", "exp": "You discount the cash flows you forecast year by year, usually 5 to 10 years, then add the terminal value, which captures everything after that.", "hint": null, "options": ["The cash flows in the projection period, and the terminal value", "Revenue and expenses", "Debt and equity", "Last year's profit and this year's profit"], "answer": 0}, {"id": "U4-1.5", "step": "Say it out loud", "q": "Walk me through a DCF.", "exp": "Model answer: First, project the company's unlevered free cash flow for around five to ten years, starting from revenue and working down to EBIT, then tax, adding back D&A and subtracting capex and changes in working capital. Next, calculate a terminal value for the years after that, using either a perpetuity growth rate or an exit multiple. Then discount the cash flows and the terminal value back to today at the WACC. Adding them gives enterprise value. Finally, subtract net debt to get equity value, and divide by diluted shares for a value per share.", "hint": "Project, terminal value, discount, bridge to equity."}]}, {"id": "u4l2", "title": "Unlevered free cash flow", "questions": [{"id": "U4-2.1", "step": "Concept", "q": "What does unlevered free cash flow represent?", "exp": "Unlevered means it ignores how the company is financed. It's the cash available to both lenders and shareholders, which is why it gives you enterprise value.", "hint": null, "options": ["Cash the business generates that is available to all investors, before interest payments", "Cash left only for shareholders after paying lenders", "Revenue minus cost of goods sold", "The company's cash balance"], "answer": 0}, {"id": "U4-2.2", "step": "Concept", "q": "Which formula gives unlevered free cash flow?", "exp": "Start with after-tax operating profit, add back non-cash D&A, then subtract what the business reinvests in equipment and working capital.", "hint": null, "options": ["EBIT × (1 − tax rate) + D&A − capex − increase in net working capital", "Net income + dividends", "Revenue − interest − taxes", "EBITDA + capex"], "answer": 0}, {"id": "U4-2.3", "step": "Calculate", "q": "EBIT is $100, the tax rate is 25%, D&A is $20, capex is $30 and net working capital increases by $10. What's unlevered free cash flow?", "exp": "After-tax EBIT is 100 × 0.75 = $75. Add D&A: 75 + 20 = 95. Subtract capex and the working capital increase: 95 − 30 − 10 = $55.", "hint": "Tax first, then add back D&A, then subtract reinvestment.", "options": ["$55", "$65", "$75", "$80"], "answer": 0}, {"id": "U4-2.4", "step": "Spot it", "q": "Which of these is NOT part of unlevered free cash flow?", "exp": "Unlevered free cash flow is before payments to lenders, so interest expense is left out. The cost of debt shows up in the discount rate instead.", "hint": null, "options": ["Capex", "Depreciation", "Interest expense", "Change in working capital"], "answer": 2}, {"id": "U4-2.5", "step": "Concept", "q": "Why does a DCF that uses unlevered free cash flow give you enterprise value, not equity value?", "exp": "Match the cash flow to the investors who own it. Unlevered cash flow is for everyone, so it values the whole business. To get to equity value, you subtract net debt afterwards.", "hint": null, "options": ["The cash flows belong to all investors, so their present value is the value to all investors", "Because it subtracts dividends", "Because it includes the share price", "It actually gives equity value"], "answer": 0}]}, {"id": "u4l3", "title": "The discount rate (WACC)", "questions": [{"id": "U4-3.1", "step": "Concept", "q": "What is WACC?", "exp": "WACC weights the cost of equity and the after-tax cost of debt by how much of each the company uses. It's the discount rate for unlevered free cash flow.", "hint": null, "options": ["The weighted average cost of capital: the blended return required by lenders and shareholders", "The company's tax rate", "The interest rate set by the central bank", "The company's revenue growth rate"], "answer": 0}, {"id": "U4-3.2", "step": "Calculate", "q": "A company is 60% equity and 40% debt. Cost of equity is 10%, the pre-tax cost of debt is 5% and the tax rate is 25%. What's the WACC?", "exp": "After-tax cost of debt is 5% × 0.75 = 3.75%. WACC = 60% × 10% + 40% × 3.75% = 6.0% + 1.5% = 7.5%.", "hint": "Don't forget the tax shield on debt.", "options": ["7.0%", "7.5%", "8.0%", "8.5%"], "answer": 1}, {"id": "U4-3.3", "step": "Concept", "q": "Why do you use the after-tax cost of debt in WACC?", "exp": "Because interest lowers taxable income, the government effectively covers part of the interest bill.", "hint": null, "options": ["Interest is tax-deductible, so debt effectively costs less", "Lenders pay the company's taxes", "Debt has no cost", "It's a rule with no reason"], "answer": 0}, {"id": "U4-3.4", "step": "Calculate", "q": "Using CAPM: the risk-free rate is 4%, the stock's beta is 1.2 and the equity risk premium is 5%. What's the cost of equity?", "exp": "Cost of equity = risk-free rate + beta × equity risk premium = 4% + 1.2 × 5% = 4% + 6% = 10%.", "hint": null, "options": ["9.0%", "10.0%", "10.8%", "6.0%"], "answer": 1}, {"id": "U4-3.5", "step": "Single step", "q": "Government bond yields rise sharply. All else equal, what happens to a company's DCF value?", "exp": "A higher risk-free rate raises the cost of equity and debt, which raises WACC. A higher discount rate makes future cash flows worth less today.", "hint": null, "options": ["It rises", "It falls", "No change", "It doubles"], "answer": 1}]}, {"id": "u4l4", "title": "Terminal value", "questions": [{"id": "U4-4.1", "step": "Concept", "q": "What does the terminal value capture?", "exp": "You can't forecast every year forever, so the terminal value sums up everything after the last projected year in one number.", "hint": null, "options": ["The value of all cash flows after the projection period", "The company's value if it shuts down", "The final year's revenue", "The price paid in the last acquisition"], "answer": 0}, {"id": "U4-4.2", "step": "Spot it", "q": "What are the two common ways to calculate terminal value?", "exp": "The perpetuity growth method assumes cash flows grow at a steady rate forever. The exit multiple method applies a multiple, like EV/EBITDA, to the final year.", "hint": null, "options": ["Perpetuity growth method and exit multiple method", "Book value and market value", "Straight-line and declining balance", "FIFO and LIFO"], "answer": 0}, {"id": "U4-4.3", "step": "Calculate", "q": "Final-year free cash flow is $100, the long-term growth rate is 2% and WACC is 8%. Using the perpetuity growth method, what's the terminal value?", "exp": "Terminal value = FCF × (1 + g) ÷ (WACC − g) = 100 × 1.02 ÷ (0.08 − 0.02) = 102 ÷ 0.06 = $1,700.", "hint": "Grow next year's cash flow first, then divide by (WACC − g).", "options": ["$1,250", "$1,667", "$1,700", "$5,100"], "answer": 2}, {"id": "U4-4.4", "step": "Calculate", "q": "Final-year EBITDA is $50 and similar companies trade at 10x EBITDA. Using the exit multiple method, what's the terminal value?", "exp": "Terminal value = 10 × $50 = $500 (before discounting back to today).", "hint": null, "options": ["$60", "$500", "$5,000", "$50"], "answer": 1}, {"id": "U4-4.5", "step": "Concept", "q": "What's a reasonable long-term growth rate for the perpetuity growth method?", "exp": "No company can grow faster than the whole economy forever. A rate above WACC would make the formula break, giving an infinite or negative value.", "hint": null, "options": ["Around long-term inflation or GDP growth, often 1-3%", "The company's growth rate this year, even if it's 30%", "Higher than the WACC", "Always exactly 10%"], "answer": 0}]}, {"id": "u4l5", "title": "What moves a DCF", "questions": [{"id": "U4-5.1", "step": "Single step", "q": "The WACC increases. What happens to the DCF value?", "exp": "A higher discount rate shrinks the present value of every future cash flow.", "hint": null, "options": ["It goes up", "It goes down", "No change", "It depends on revenue only"], "answer": 1}, {"id": "U4-5.2", "step": "Single step", "q": "The long-term growth rate assumption increases. What happens to the DCF value?", "exp": "Higher growth makes the terminal value bigger, which raises the total value.", "hint": null, "options": ["It goes up", "It goes down", "No change", "The DCF stops working"], "answer": 0}, {"id": "U4-5.3", "step": "Concept", "q": "Roughly how much of a typical DCF's value comes from the terminal value?", "exp": "Because the terminal value covers all years after the forecast, it's usually the biggest piece of the value. That's why its assumptions matter so much.", "hint": null, "options": ["Often more than half", "Almost none", "Exactly 10%", "Always 100%"], "answer": 0}, {"id": "U4-5.4", "step": "Say it out loud", "q": "How would an interest rate hike affect a DCF valuation?", "exp": "Model answer: A rate hike raises the risk-free rate, which feeds into both the cost of equity and the cost of debt, so WACC goes up. With a higher discount rate, every future cash flow and the terminal value are worth less today, so the DCF value falls. Higher rates can also hurt the cash flows themselves, for example through weaker demand or higher interest costs. The effect is biggest for companies whose value depends on cash flows far in the future, like high-growth tech.", "hint": "Discount rate first, then cash flows."}]}]}, {"unit": 5, "title": "Merger model", "lessons": [{"id": "u5l1", "title": "Why companies buy", "questions": [{"id": "U5-1.1", "step": "Concept", "q": "What's a common reason one company buys another?", "exp": "Buying can be faster than building: it adds customers, products or markets, and combining can cut costs or boost sales.", "hint": null, "options": ["To grow faster, gain market share or capture synergies", "To lower its share count", "To avoid paying dividends", "Because it's required by law"], "answer": 0}, {"id": "U5-1.2", "step": "Concept", "q": "Which type of synergy is usually seen as more reliable?", "exp": "Cost savings, like closing duplicate offices, are mostly in management's control. Revenue synergies depend on customers buying more, which is harder to predict.", "hint": null, "options": ["Cost synergies", "Revenue synergies", "They're equally reliable", "Neither is ever achieved"], "answer": 0}, {"id": "U5-1.3", "step": "Spot it", "q": "Which of these is a cost synergy?", "exp": "Shutting a duplicate head office removes costs. Cross-selling and new markets are revenue synergies.", "hint": null, "options": ["Selling the buyer's products to the target's customers", "Combining two head offices into one", "Raising prices after the deal", "Entering a new country"], "answer": 1}, {"id": "U5-1.4", "step": "Calculate", "q": "A target's shares trade at $40. A buyer offers $50 per share. What's the premium?", "exp": "Premium = (50 − 40) ÷ 40 = 25%.", "hint": null, "options": ["10%", "20%", "25%", "50%"], "answer": 2}]}, {"id": "u5l2", "title": "Accretion and dilution", "questions": [{"id": "U5-2.1", "step": "Concept", "q": "What does it mean if a deal is accretive?", "exp": "Accretive means pro forma EPS, for the combined company, is higher than the buyer's EPS on its own. Dilutive means it's lower.", "hint": null, "options": ["The buyer's earnings per share go up after the deal", "The buyer's share price goes down", "The target's debt is paid off", "The deal has no synergies"], "answer": 0}, {"id": "U5-2.2", "step": "Calculate", "q": "A buyer's standalone EPS is $2.00. After the deal, pro forma EPS is $2.10. How accretive is the deal?", "exp": "Accretion = (2.10 − 2.00) ÷ 2.00 = 5%.", "hint": null, "options": ["0.5%", "5%", "10%", "21%"], "answer": 1}, {"id": "U5-2.3", "step": "Concept", "q": "In an all-stock deal, when is the deal usually accretive?", "exp": "A high P/E means the buyer's shares are an expensive currency. It gives up relatively few shares for each dollar of the target's earnings, so EPS rises. This quick rule ignores synergies and fees.", "hint": "Which company's shares are the more expensive currency?", "options": ["When the buyer's P/E is higher than the P/E it pays for the target", "When the buyer's share price is lower than the target's", "When the target has more employees", "Always"], "answer": 0}, {"id": "U5-2.4", "step": "Single step", "q": "A buyer trades at 20x earnings and buys a target at 15x earnings, paying all in stock. Ignoring synergies, is it accretive or dilutive?", "exp": "The buyer's P/E (20x) is higher than the P/E paid for the target (15x), so it adds more earnings than it gives away in new shares.", "hint": null, "options": ["Accretive", "Dilutive", "Neither", "You can't tell"], "answer": 0}, {"id": "U5-2.5", "step": "Single step", "q": "A buyer pays all cash for a target at 10x earnings. The cash was earning 4% after tax. Ignoring synergies, is it accretive or dilutive?", "exp": "At 10x earnings, the target's earnings yield is 1 ÷ 10 = 10%. That's more than the 4% after-tax return the buyer gives up on its cash, so EPS rises.", "hint": "Compare the target's earnings yield to the cost of the cash.", "options": ["Accretive", "Dilutive", "Neither", "You can't tell"], "answer": 0}, {"id": "U5-2.6", "step": "Say it out loud", "q": "Walk me through a basic merger model.", "exp": "Model answer: Start with the purchase price and how it's paid: cash, new debt, new stock or a mix. Then combine the buyer's and target's income statements, and adjust for the deal: lost interest on cash used, new interest on debt raised, synergies, and new depreciation or amortization from writing up assets. That gives pro forma net income. Divide by the new share count, the buyer's shares plus any shares issued, for pro forma EPS. Compare it to the buyer's standalone EPS to see if the deal is accretive or dilutive.", "hint": "Price, financing, combine, adjust, new EPS."}]}, {"id": "u5l3", "title": "Paying with cash, debt or stock", "questions": [{"id": "U5-3.1", "step": "Concept", "q": "Which way of paying for a deal is usually the cheapest for the buyer?", "exp": "Cash usually earns little interest, so the return given up is small. Debt costs more in interest, and stock is usually the most expensive, because shareholders expect higher returns and it dilutes ownership.", "hint": null, "options": ["Cash on hand", "New debt", "New stock", "They all cost the same"], "answer": 0}, {"id": "U5-3.2", "step": "Concept", "q": "Why might a buyer pay with stock instead of cash?", "exp": "Stock lets a buyer pay for a large deal without cash or debt, and it's attractive when the buyer's shares trade at a high price. It also means the target's shareholders share the future risk.", "hint": null, "options": ["It doesn't have enough cash or borrowing room, or its stock is highly valued", "Stock never dilutes existing shareholders", "Stock is always cheaper than cash", "Paying with stock is required for public companies"], "answer": 0}, {"id": "U5-3.3", "step": "Concept", "q": "What's the main risk of funding a deal with a lot of debt?", "exp": "More debt means bigger interest bills and less room for error if the business slows down.", "hint": null, "options": ["Higher interest costs and the risk of a credit downgrade or financial stress", "It always makes the deal dilutive", "It increases the buyer's share count", "There is no risk"], "answer": 0}, {"id": "U5-3.4", "step": "Concept", "q": "If a buyer issues new shares to pay for a deal, what happens to its existing shareholders?", "exp": "More shares outstanding means each existing share is a smaller slice of the company.", "hint": null, "options": ["Their ownership percentage goes down", "Their ownership goes up", "Nothing", "They receive cash"], "answer": 0}]}, {"id": "u5l4", "title": "Deal accounting", "questions": [{"id": "U5-4.1", "step": "Calculate", "q": "A buyer pays $500 for a company whose identifiable net assets have a fair value of $350. How much goodwill is created?", "exp": "Goodwill = purchase price − fair value of net identifiable assets = 500 − 350 = $150.", "hint": null, "options": ["$150", "$350", "$500", "$850"], "answer": 0}, {"id": "U5-4.2", "step": "Concept", "q": "What does 'pro forma' mean in a merger model?", "exp": "Pro forma financials show what the combined company would look like with the deal included.", "hint": null, "options": ["The combined numbers as if the deal had already happened", "The target's numbers before the deal", "A forecast for one company only", "The official audited results"], "answer": 0}, {"id": "U5-4.3", "step": "Concept", "q": "Can a dilutive deal still be a good deal?", "exp": "Short-term EPS isn't everything. A deal can be dilutive in year one but strategically valuable, for example buying a fast-growing business or gaining scale.", "hint": null, "options": ["Yes, if it creates long-term value through growth or synergies that take time to show up", "No, dilutive deals are always bad", "Only if it's paid in cash", "Only if it's in Canada"], "answer": 0}]}]}, {"unit": 6, "title": "LBO", "lessons": [{"id": "u6l1", "title": "What an LBO is", "questions": [{"id": "U6-1.1", "step": "Concept", "q": "What is a leveraged buyout (LBO)?", "exp": "The PE firm puts in some equity, borrows the rest, uses the business's cash to repay debt over a few years, and aims to sell for more than it paid.", "hint": null, "options": ["A private equity firm buys a company using a lot of debt, pays the debt down with the company's cash flow, then sells it", "A company buying back its own shares", "A government taking over a bank", "A company issuing new shares to the public"], "answer": 0}, {"id": "U6-1.2", "step": "Concept", "q": "Why does a PE firm use so much debt in an LBO?", "exp": "If the deal works, the gains go to a smaller equity cheque, so the percentage return is higher. Debt also increases risk if things go badly.", "hint": null, "options": ["It means less equity is needed, which boosts the return on that equity", "Debt is free", "Lenders take all the risk", "It's required by regulators"], "answer": 0}, {"id": "U6-1.3", "step": "Spot it", "q": "Which company is the best LBO candidate?", "exp": "Lenders and PE firms want reliable cash flow to pay down debt. Steady demand, low capex and a strong market position all help.", "hint": null, "options": ["A stable business with steady cash flow and low capex needs", "A startup with no revenue", "A company with very volatile, unpredictable earnings", "A business that needs huge capex every year"], "answer": 0}, {"id": "U6-1.4", "step": "Concept", "q": "What are the three main ways a PE firm makes money in an LBO?", "exp": "Debt paydown turns more of the company's value into equity, EBITDA growth raises the value of the business, and multiple expansion means selling for a higher multiple than you paid.", "hint": null, "options": ["Paying down debt, growing EBITDA, and selling at a higher multiple", "Dividends, interest and fees only", "Raising prices, cutting staff and lowering taxes", "Issuing stock, buying bonds and trading options"], "answer": 0}, {"id": "U6-1.5", "step": "Say it out loud", "q": "Walk me through a basic LBO model.", "exp": "Model answer: First, set the purchase price and how it's funded: the sources and uses, meaning how much debt and sponsor equity pay for the price and fees. Next, project the company's cash flows for about five years and use the free cash flow to pay down debt. Then assume an exit, usually by applying an EV/EBITDA multiple to the final year's EBITDA. Subtract the remaining debt to get the equity value at exit. Finally, compare that to the equity put in to calculate the multiple of money and the IRR.", "hint": "Sources and uses, projections, debt paydown, exit, returns."}]}, {"id": "u6l2", "title": "Sources and uses", "questions": [{"id": "U6-2.1", "step": "Concept", "q": "In an LBO, what are 'sources' and 'uses'?", "exp": "The two sides must match: every dollar spent on the purchase price and fees has to come from debt or equity.", "hint": null, "options": ["Uses are what the money pays for, like the purchase price and fees; sources are where it comes from, like debt and sponsor equity", "Sources are revenue; uses are expenses", "Sources are assets; uses are liabilities", "They're two names for the same thing"], "answer": 0}, {"id": "U6-2.2", "step": "Calculate", "q": "A PE firm buys a company for $1,000 and pays $20 in fees. It raises $600 of debt. How much equity does the PE firm need to put in?", "exp": "Total uses = 1,000 + 20 = $1,020. Equity = uses − debt = 1,020 − 600 = $420.", "hint": "Add the fees to the price first.", "options": ["$380", "$400", "$420", "$620"], "answer": 2}, {"id": "U6-2.3", "step": "Calculate", "q": "The company has $100 of EBITDA and $600 of debt. What's its leverage ratio?", "exp": "Leverage = debt ÷ EBITDA = 600 ÷ 100 = 6.0x. It shows how many years of EBITDA it would take to repay the debt.", "hint": null, "options": ["0.6x", "1.7x", "6.0x", "60x"], "answer": 2}]}, {"id": "u6l3", "title": "Paying down debt", "questions": [{"id": "U6-3.1", "step": "Concept", "q": "Why does paying down debt increase the PE firm's equity value, even if the business's value doesn't change?", "exp": "Equity value = enterprise value − net debt. If enterprise value stays flat and debt falls, equity value rises by the same amount.", "hint": null, "options": ["With the same enterprise value and less debt, more of the value belongs to equity", "Paying debt increases revenue", "Debt paydown raises the share price on the stock market", "It doesn't increase equity value"], "answer": 0}, {"id": "U6-3.2", "step": "Calculate", "q": "A PE firm buys a company for $1,000 using $600 of debt and $400 of equity. At exit, it sells for $1,000 and debt has been paid down to $300. What's the equity worth at exit?", "exp": "Equity at exit = exit value − remaining debt = 1,000 − 300 = $700. The business value didn't change, but $300 of debt paydown added $300 to equity.", "hint": null, "options": ["$400", "$600", "$700", "$1,000"], "answer": 2}, {"id": "U6-3.3", "step": "Concept", "q": "What is a cash sweep?", "exp": "Instead of keeping spare cash, the company uses it to pay down debt faster, which cuts interest costs and builds equity value.", "hint": null, "options": ["Using the company's extra cash each year to repay debt early", "Moving cash to a new bank", "Paying a special dividend", "Selling the company for cash"], "answer": 0}]}, {"id": "u6l4", "title": "LBO returns", "questions": [{"id": "U6-4.1", "step": "Calculate", "q": "A PE firm invests $400 of equity and receives $1,000 at exit. What's the multiple of money (MOIC)?", "exp": "MOIC = equity at exit ÷ equity invested = 1,000 ÷ 400 = 2.5x.", "hint": null, "options": ["1.5x", "2.0x", "2.5x", "4.0x"], "answer": 2}, {"id": "U6-4.2", "step": "Concept", "q": "What does IRR measure that MOIC doesn't?", "exp": "Doubling your money in two years is much better than doubling it in ten. IRR turns the return into a yearly rate, so time matters.", "hint": null, "options": ["How long it took to earn the return, as an annual rate", "The total dollars earned", "The company's revenue growth", "The interest rate on the debt"], "answer": 0}, {"id": "U6-4.3", "step": "Calculate", "q": "A PE firm doubles its money (2.0x) over 5 years. Roughly what's the IRR?", "exp": "A common rule of thumb: 2x in 5 years is roughly 15% a year (1.15 to the fifth power is about 2.0). 3x in 5 years is roughly 25%.", "hint": "1.15 × 1.15 × 1.15 × 1.15 × 1.15 ≈ 2", "options": ["About 10%", "About 15%", "About 20%", "About 40%"], "answer": 1}, {"id": "U6-4.4", "step": "Calculate", "q": "A PE firm doubles its money (2.0x) over 3 years. Roughly what's the IRR?", "exp": "You need the yearly rate where (1 + r)³ = 2. The cube root of 2 is about 1.26, so the IRR is roughly 26%.", "hint": "Which rate, compounded three times, doubles your money?", "options": ["About 15%", "About 20%", "About 26%", "About 33%"], "answer": 2}, {"id": "U6-4.5", "step": "Single step", "q": "Two deals both return 2.0x. One takes 3 years, the other 6 years. Which has the higher IRR?", "exp": "Same multiple, less time, so the annual return is higher. Roughly 26% for 3 years versus about 12% for 6 years.", "hint": null, "options": ["The 3-year deal", "The 6-year deal", "They're the same", "You can't tell"], "answer": 0}, {"id": "U6-4.6", "step": "Say it out loud", "q": "What makes a company a good LBO candidate?", "exp": "Model answer: Strong, predictable cash flow is the most important thing, because that's what pays down the debt. Low capex needs and stable working capital leave more cash for debt paydown. A strong market position or recurring revenue makes those cash flows more reliable. It also helps to have clear ways to improve the business, like cost cuts or growth opportunities, a reasonable purchase price, and a realistic exit, such as selling to a strategic buyer or another PE firm.", "hint": "Start with cash flow and why it matters."}]}]}];
