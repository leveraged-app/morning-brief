<!doctype html>
<html lang="en">
<head>

<title>Leveraged: Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F5F1;color:#12161C;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;line-height:1.5}
a{color:#0F6B4F}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 120px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.brand{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px}
nav a{margin-left:14px;font-size:14px;font-weight:600;text-decoration:none;color:#5B6270;display:inline-block;padding:10px 0}
nav a.on{color:#0F6B4F}
h1{font-family:'Space Grotesk',Inter,sans-serif;font-size:30px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.5px}
h2{font-size:16px;margin:24px 0 10px}
.stats{display:flex;gap:8px;margin:0 0 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #E3E1DA;font-size:14px;font-weight:700}
.pill.fire{color:#8A3B06}.pill.xp{color:#1E3A8A}
.unit{background:#fff;border:1px solid #E3E1DA;border-radius:18px;padding:6px 6px 6px;margin:0 0 14px}
.unit-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 6px}
.unit-h b{font-size:15px}.unit-h span{font-size:13px;color:#5B6270}
.bar{height:8px;border-radius:999px;background:#E3E1DA;overflow:hidden;margin:0 12px 8px}
.bar>div{height:8px;background:#0F6B4F}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.lesson:hover{background:#F6F5F1}
.dot{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:14px;background:#E3E1DA;color:#5B6270}
.dot.done{background:#0F6B4F;color:#fff}
.dot.next{background:#fff;border:3px solid #0F6B4F;color:#0F6B4F}
.lesson .t{font-weight:600;font-size:15px}.lesson .s{font-size:13px;color:#5B6270}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.x{width:44px;height:44px;border:0;background:none;font-size:26px;color:#5B6270;cursor:pointer;border-radius:10px}
.prog{flex:1;height:12px;border-radius:999px;background:#E3E1DA;overflow:hidden}
.prog>div{height:12px;background:#0F6B4F;border-radius:999px;transition:width .3s}
.kicker{font-size:12px;font-weight:700;letter-spacing:.5px;color:#0A5A40;text-transform:uppercase}
.q{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px;font-weight:600;line-height:1.3;margin:6px 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 14px;margin:0 0 10px;border-radius:14px;border:1px solid #D6D3CA;background:#fff;font:inherit;font-weight:600;font-size:15px;color:#12161C;cursor:pointer;box-shadow:0 2px 0 #D6D3CA}
.opt .k{width:28px;height:28px;border-radius:8px;border:1px solid #D6D3CA;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5B6270;flex-shrink:0}
.opt.sel{border:2px solid #0F6B4F;background:#E4F1EC;box-shadow:0 2px 0 #0F6B4F}
.opt.right{border:2px solid #0B6E4F;background:#E4F1EC;box-shadow:0 2px 0 #0B6E4F}
.opt.wrong{border:2px solid #B42318;background:#FDECEA;box-shadow:0 2px 0 #B42318}
.opt:disabled{cursor:default}
.hintbtn{background:none;border:0;color:#0F6B4F;font:inherit;font-weight:600;font-size:14px;padding:8px 0;cursor:pointer}
.hint{font-size:14px;color:#5B6270;margin:0 0 10px}
textarea{width:100%;min-height:120px;border:1px solid #D6D3CA;border-radius:14px;padding:12px;font:inherit;font-size:15px;background:#fff}
label.lbl{display:block;font-size:13px;font-weight:600;color:#5B6270;margin:0 0 6px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#F6F5F1;border-top:1px solid #E3E1DA;padding:14px 16px 22px}
.foot .in{max-width:680px;margin:0 auto}
.foot.ok{background:#E4F1EC;border-color:transparent}
.foot.bad{background:#FDECEA;border-color:transparent}
.verdict{font-weight:700;font-size:17px;margin:0 0 4px}
.foot.ok .verdict{color:#0B6E4F}.foot.bad .verdict{color:#B42318}
.exp{font-size:14px;margin:0 0 12px;line-height:1.5}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:#0F6B4F;color:#fff}
.btn:disabled{background:#E3E1DA;color:#5B6270;cursor:default}
.btn.red{background:#B42318}
.btn.ghost{background:#fff;color:#12161C;border:1px solid #D6D3CA}
.row{display:flex;gap:10px}.row .btn{flex:1}
.done-card{text-align:center;padding:40px 10px}
.big{font-family:'Space Grotesk',Inter,sans-serif;font-size:44px;font-weight:700;margin:8px 0}
.muted{color:#5B6270;font-size:14px}
.model{background:#fff;border:1px solid #C3DFD3;border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0 0}
footer{color:#5B6270;font-size:12px;margin-top:24px}
</style>

<script>
const DATA = [{"unit": 0, "title": "How markets move", "lessons": [{"id": "u0l1", "title": "Interest rates and central banks", "questions": [{"id": "U0-1.1", "step": "Concept", "q": "What does a central bank like the Bank of Canada or the Fed mainly control?", "exp": "Central banks set a short-term policy rate (the overnight rate in Canada, the federal funds rate in the US). That rate ripples out to mortgages, loans and savings rates across the economy.", "hint": null, "options": ["The price of stocks", "A short-term policy interest rate", "The price of oil", "Corporate taxes"], "answer": 1}, {"id": "U0-1.2", "step": "Concept", "q": "Why would a central bank raise interest rates?", "exp": "Higher rates make loans and mortgages cost more, so people and businesses borrow and spend less. Less spending takes pressure off prices.", "hint": "What happens when borrowing gets expensive?", "options": ["To speed up the economy", "To slow down inflation by making borrowing more expensive", "To make the stock market go up", "To weaken its own currency"], "answer": 1}, {"id": "U0-1.3", "step": "Concept", "q": "Why do higher interest rates usually hurt stock valuations?", "exp": "A stock is worth the present value of its future cash flows. A higher discount rate shrinks that present value. Borrowing also gets more expensive for companies.", "hint": "Think about a DCF.", "options": ["Future cash flows get discounted at a higher rate, so they're worth less today", "Companies stop paying taxes", "Higher rates always cause recessions immediately", "Stocks pay interest"], "answer": 0}, {"id": "U0-1.4", "step": "Single step", "q": "The Bank of Canada unexpectedly cuts rates. What usually happens to the Canadian dollar?", "exp": "Lower rates make Canadian bonds and savings less attractive to global investors, so demand for the loonie falls and it usually weakens.", "hint": null, "options": ["It strengthens", "It weakens", "Nothing", "It's pegged, so it can't move"], "answer": 1}, {"id": "U0-1.5", "step": "Spot it", "q": "Which sector often benefits from higher interest rates?", "exp": "Banks can often earn a wider spread between what they charge on loans and what they pay on deposits. Utilities, real estate and growth stocks tend to suffer, because they rely on borrowing or on cash flows far in the future.", "hint": null, "options": ["Banks", "Utilities", "Real estate", "Fast-growing tech"], "answer": 0}]}, {"id": "u0l2", "title": "Bond yields", "questions": [{"id": "U0-2.1", "step": "Concept", "q": "When bond prices go up, what happens to their yields?", "exp": "A bond pays fixed coupons. If you pay more for the bond, those same payments are a smaller return on your money, so the yield falls. Price and yield move in opposite directions.", "hint": null, "options": ["Yields go up", "Yields go down", "Yields stay the same", "It depends on the stock market"], "answer": 1}, {"id": "U0-2.2", "step": "Concept", "q": "Why do people watch the 10-year government bond yield so closely?", "exp": "The 10-year yield affects mortgage rates and corporate borrowing, and it's a building block for discount rates. When it moves, valuations across markets move too.", "hint": null, "options": ["It's a benchmark for borrowing costs and for valuing stocks", "It's the central bank's policy rate", "It measures inflation directly", "It only matters to bond traders"], "answer": 0}, {"id": "U0-2.3", "step": "Calculate", "q": "The 10-year yield rises from 4.10% to 4.25%. How many basis points is that?", "exp": "One basis point is 0.01%. A move of 0.15% equals 15 basis points.", "hint": "1 bp = 0.01%.", "options": ["1.5 bps", "15 bps", "150 bps", "0.15 bps"], "answer": 1}, {"id": "U0-2.4", "step": "Concept", "q": "What does an inverted yield curve mean?", "exp": "Normally investors demand more to lend for longer, so long-term yields are higher. When short-term yields go above long-term ones, it often signals investors expect rate cuts and a slowdown. It has come before many past recessions.", "hint": null, "options": ["Short-term yields are higher than long-term yields", "Long-term yields are higher than short-term yields", "All yields are zero", "Stocks are yielding more than bonds"], "answer": 0}, {"id": "U0-2.5", "step": "Single step", "q": "Stocks sell off hard and investors rush to safety. What usually happens to government bond yields?", "exp": "Investors buy safe government bonds, which pushes bond prices up and yields down.", "hint": "Remember: price up, yield down.", "options": ["They rise", "They fall", "They don't move", "They turn negative"], "answer": 1}]}, {"id": "u0l3", "title": "Oil and commodities", "questions": [{"id": "U0-3.1", "step": "Single step", "q": "OPEC+ announces it will cut oil production. What usually happens to oil prices?", "exp": "Less supply with the same demand pushes prices up.", "hint": null, "options": ["They rise", "They fall", "No change", "They go to zero"], "answer": 0}, {"id": "U0-3.2", "step": "Spot it", "q": "Oil drops 10%. Which of these is usually hurt the most?", "exp": "Producers earn less on every barrel they sell. Airlines, truckers and drivers all benefit, because fuel is one of their costs.", "hint": null, "options": ["Airlines", "Canadian oil and gas producers", "Trucking companies", "Consumers buying gas"], "answer": 1}, {"id": "U0-3.3", "step": "Concept", "q": "Why does the TSX often react more to oil prices than the S&P 500 does?", "exp": "Energy is one of the TSX's biggest sectors, while it's a much smaller slice of the S&P 500. So swings in oil move the Canadian index more.", "hint": null, "options": ["Energy companies make up a much bigger share of the TSX", "The TSX is priced in barrels of oil", "Canada doesn't have tech companies", "The S&P 500 doesn't include energy companies"], "answer": 0}, {"id": "U0-3.4", "step": "Concept", "q": "Why do oil prices matter for inflation?", "exp": "Higher oil means higher gas prices and higher transport and production costs, which spread to other prices. Cheaper oil does the opposite.", "hint": null, "options": ["Oil feeds into gas, shipping and the cost of making many goods", "Oil is part of the central bank's policy rate", "Oil prices are set by the government", "They don't affect inflation"], "answer": 0}, {"id": "U0-3.5", "step": "Concept", "q": "When does gold often rise?", "exp": "Gold pays no interest, so it looks better when interest rates after inflation are low. Investors also buy it as a safe store of value when they're worried.", "hint": null, "options": ["When investors are nervous or when real interest rates fall", "Only when stocks are rising", "When interest rates rise sharply", "Gold never changes price"], "answer": 0}]}, {"id": "u0l4", "title": "Currencies and the loonie", "questions": [{"id": "U0-4.1", "step": "Concept", "q": "USD/CAD goes from 1.35 to 1.40. What happened to the Canadian dollar?", "exp": "USD/CAD is how many Canadian dollars it takes to buy one US dollar. Needing 1.40 instead of 1.35 means the loonie buys less, so it weakened.", "hint": "More CAD per USD means...", "options": ["It strengthened", "It weakened", "No change", "It was revalued by the government"], "answer": 1}, {"id": "U0-4.2", "step": "Calculate", "q": "USD/CAD is 1.40. You buy something that costs US$100. How much is that in Canadian dollars?", "exp": "Multiply by the rate: 100 × 1.40 = C$140.", "hint": null, "options": ["C$71.43", "C$100", "C$140", "C$114"], "answer": 2}, {"id": "U0-4.3", "step": "Concept", "q": "Why does the Canadian dollar often move with oil prices?", "exp": "When oil is expensive, buyers need more Canadian dollars to pay for Canadian oil, and money flows into the country. That tends to lift the loonie.", "hint": null, "options": ["Oil is a major Canadian export, so higher oil means more demand for Canadian dollars", "The Canadian dollar is backed by oil", "The Bank of Canada sets oil prices", "It doesn't, they're unrelated"], "answer": 0}, {"id": "U0-4.4", "step": "Spot it", "q": "Who usually benefits from a weaker Canadian dollar?", "exp": "Exporters earn US dollars, which convert into more Canadian dollars when the loonie is weak. Travellers and importers pay more.", "hint": null, "options": ["Canadians travelling to the US", "Canadian exporters that sell in US dollars", "Canadian importers", "Nobody"], "answer": 1}, {"id": "U0-4.5", "step": "Single step", "q": "The Bank of Canada cuts rates while the Fed holds steady. What usually happens to USD/CAD?", "exp": "The gap between US and Canadian rates widens in favour of the US, so investors prefer US dollars. The loonie weakens, and USD/CAD goes up.", "hint": null, "options": ["It rises (the loonie weakens)", "It falls (the loonie strengthens)", "No change", "It goes to 1.00"], "answer": 0}]}, {"id": "u0l5", "title": "Earnings season", "questions": [{"id": "U0-5.1", "step": "Spot it", "q": "On earnings day, which numbers do investors usually compare to analysts' estimates first?", "exp": "Headlines focus on whether EPS and revenue beat or missed the consensus estimate.", "hint": null, "options": ["Earnings per share and revenue", "The number of employees", "The share count", "The dividend date"], "answer": 0}, {"id": "U0-5.2", "step": "Concept", "q": "What is guidance?", "exp": "Guidance is what the company expects for upcoming quarters or the year. Markets often care about it more than the results just reported.", "hint": null, "options": ["Management's forecast for future results", "A rule from the stock exchange", "A rating from a credit agency", "Last quarter's results"], "answer": 0}, {"id": "U0-5.3", "step": "Concept", "q": "A company beats its earnings estimates, but the stock falls. What's the most likely reason?", "exp": "Prices reflect expectations. If investors expected a big beat, or the company lowered its outlook, the stock can drop even on good numbers.", "hint": null, "options": ["Weak guidance, or results that weren't as strong as investors hoped", "Stocks always fall on earnings day", "The company paid too much tax", "Beating estimates is bad news"], "answer": 0}, {"id": "U0-5.4", "step": "Concept", "q": "When Canadian banks report, why do investors watch provisions for credit losses closely?", "exp": "Rising provisions mean the bank expects more borrowers to struggle. That's both a hit to profit and a read on the wider economy.", "hint": null, "options": ["It's money set aside for loans that might not be repaid, so it signals how borrowers are doing", "It's the bank's dividend", "It's how much the bank paid its executives", "It's the bank's share buyback"], "answer": 0}]}, {"id": "u0l6", "title": "Economic data", "questions": [{"id": "U0-6.1", "step": "Concept", "q": "What does CPI measure?", "exp": "CPI tracks how much prices for things like food, rent and gas are rising. It's the main inflation number central banks watch.", "hint": null, "options": ["Changes in the prices of a basket of everyday goods and services (inflation)", "Total output of the economy", "The unemployment rate", "Company profits"], "answer": 0}, {"id": "U0-6.2", "step": "Single step", "q": "Inflation (CPI) comes in hotter than expected. What's the most likely market reaction?", "exp": "Higher inflation means the central bank may keep rates higher for longer, which pushes yields up and weighs on stock valuations.", "hint": null, "options": ["Bond yields rise and stocks often fall, because rate cuts look less likely", "Bond yields fall and stocks rally", "Nothing happens", "Oil prices automatically rise"], "answer": 0}, {"id": "U0-6.3", "step": "Concept", "q": "Why do markets sometimes fall on a very strong jobs report?", "exp": "This is the 'good news is bad news' effect. If the economy looks hot, investors expect fewer rate cuts.", "hint": null, "options": ["A strong economy can mean the central bank keeps rates higher for longer", "Investors dislike low unemployment", "Jobs reports are always wrong", "Strong jobs mean companies will lose money"], "answer": 0}, {"id": "U0-6.4", "step": "Concept", "q": "What is a common rule of thumb for a recession?", "exp": "GDP measures the total value of goods and services an economy produces. Two straight quarters of decline is the popular shorthand, though official calls look at more data.", "hint": null, "options": ["Two quarters in a row of falling GDP", "Any month the stock market falls", "Inflation above 2%", "When the central bank raises rates"], "answer": 0}, {"id": "U0-6.5", "step": "Say it out loud", "q": "How would a Bank of Canada rate cut affect the TSX?", "exp": "Model answer: A cut lowers borrowing costs and discount rates, which usually supports stock valuations, especially rate-sensitive sectors like real estate and utilities. It also tends to weaken the loonie, which helps exporters. Banks can be mixed: cheaper borrowing can support loan growth and credit quality, but margins can get squeezed. The reaction also depends on expectations. If the cut was already priced in, or it signals the economy is weak, the market might not rally.", "hint": "Valuations, the loonie, then sectors."}, {"id": "U0-6.6", "step": "Say it out loud", "q": "Tell me about something happening in the markets right now and why it matters.", "exp": "Model answer structure (use today's brief): 1) What happened, with a number, e.g. 'oil fell about 3% yesterday.' 2) Why it happened, e.g. 'expectations of more supply.' 3) Why it matters: who wins and loses, like energy producers vs airlines, and what it means for inflation, rates or deals. 4) What you're watching next, e.g. 'the next OPEC+ meeting.' Keep it under a minute and show a view, not just a headline.", "hint": "What, why, so what, what's next."}]}]}, {"unit": 1, "title": "Accounting", "lessons": [{"id": "u1l1", "title": "The income statement", "questions": [{"id": "U1-1.1", "step": "Concept", "q": "What does the income statement show?", "exp": "The income statement covers a period, like a quarter or a year, and ends at net income. The balance sheet is the one that shows a single day.", "hint": "Think 'over a period' vs 'on one day'.", "options": ["A company's revenue, expenses and profit over a period of time", "What a company owns and owes on one specific day", "All the cash that came in and went out", "How the company's share price has changed"], "answer": 0}, {"id": "U1-1.2", "step": "Spot it", "q": "Which of these is NOT on the income statement?", "exp": "Inventory is an asset on the balance sheet. It only reaches the income statement as cost of goods sold once the products are sold.", "hint": "Which one is something the company owns?", "options": ["Cost of goods sold", "Interest expense", "Inventory", "Income tax expense"], "answer": 2}, {"id": "U1-1.3", "step": "Calculate", "q": "Revenue is $100, COGS is $40, operating expenses are $30 and interest expense is $10. The tax rate is 25%. What is net income?", "exp": "Operating income is 100 − 40 − 30 = $30. Subtract $10 of interest for pre-tax income of $20. Tax is 25% × 20 = $5, so net income is $15.", "hint": "Work down the statement: operating income, then pre-tax income, then tax.", "options": ["$15", "$20", "$22.50", "$30"], "answer": 0}, {"id": "U1-1.4", "step": "Concept", "q": "Why doesn't a $100 equipment purchase show up as a $100 expense on the income statement?", "exp": "Equipment helps the company for many years, so its cost is expensed gradually through depreciation instead of all at once. The purchase itself shows up on the cash flow statement as capex.", "hint": "How long does equipment help the business?", "options": ["It's a long-lived asset, so its cost is spread out over time as depreciation", "Equipment purchases are never tax-deductible", "It's counted as negative revenue instead", "Companies can choose to leave it off entirely"], "answer": 0}, {"id": "U1-1.5", "step": "Spot it", "q": "Which of these is a non-cash expense?", "exp": "Depreciation lowers profit, but no cash leaves the company that year. The cash left when the asset was bought.", "hint": "Which one doesn't involve paying anyone this year?", "options": ["Salaries", "Rent", "Depreciation", "Interest on a loan"], "answer": 2}, {"id": "U1-1.6", "step": "Concept", "q": "What is EBITDA?", "exp": "EBITDA is a rough measure of operating profit that ignores how a company is financed (interest), taxes and non-cash D&A. That makes it easy to compare companies.", "hint": "Each letter is something it comes 'before'.", "options": ["Earnings before interest, taxes, depreciation and amortization", "Earnings after all expenses and taxes", "Total revenue before any costs", "Cash left after paying for capex"], "answer": 0}]}, {"id": "u1l2", "title": "The balance sheet", "questions": [{"id": "U1-2.1", "step": "Concept", "q": "What does the balance sheet show?", "exp": "The balance sheet is a snapshot of assets, liabilities and equity at a single point in time, like the last day of the quarter.", "hint": null, "options": ["Revenue and expenses for the year", "What a company owns, owes and the owners' stake on one specific day", "Cash coming in and going out", "A list of the company's customers"], "answer": 1}, {"id": "U1-2.2", "step": "Concept", "q": "Which equation is always true on the balance sheet?", "exp": "Everything a company owns (assets) was paid for either by borrowing (liabilities) or by the owners (equity). So both sides must always match.", "hint": "Where does the money to buy assets come from?", "options": ["Assets = Liabilities + Equity", "Assets = Revenue − Expenses", "Equity = Assets + Liabilities", "Liabilities = Assets + Cash"], "answer": 0}, {"id": "U1-2.3", "step": "Spot it", "q": "Which of these is a liability?", "exp": "Deferred revenue is cash a customer paid before the company delivered the product. The company owes them the product, so it's a liability. The other three are assets.", "hint": "Which one means the company still owes the customer something?", "options": ["Accounts receivable", "Deferred revenue", "Prepaid expenses", "Inventory"], "answer": 1}, {"id": "U1-2.4", "step": "Concept", "q": "What does accounts receivable mean?", "exp": "The company made the sale and recorded the revenue, but the customer hasn't paid yet. It's an asset because that cash is coming in.", "hint": null, "options": ["Money the company owes its suppliers", "Cash customers paid in advance", "Money customers owe the company for sales already recorded", "Cash sitting in the bank"], "answer": 2}, {"id": "U1-2.5", "step": "Concept", "q": "A gym collects $120 for a 12-month membership up front. Right after collecting, how is this recorded?", "exp": "The gym has the cash but hasn't delivered the service yet, so it records deferred revenue. Each month it earns $10, moving $10 from deferred revenue into revenue.", "hint": "Has the gym earned it yet?", "options": ["$120 of revenue right away", "$120 of deferred revenue (a liability)", "$120 of accounts receivable", "Nothing until the year ends"], "answer": 1}, {"id": "U1-2.6", "step": "Spot it", "q": "Which balance sheet item does net income flow into?", "exp": "Net income adds to retained earnings, which is part of equity. Dividends paid out come off retained earnings.", "hint": "It's the 'kept profits' account.", "options": ["Cash", "Common stock", "Retained earnings", "Accounts payable"], "answer": 2}]}, {"id": "u1l3", "title": "The cash flow statement", "questions": [{"id": "U1-3.1", "step": "Concept", "q": "Why do we need a cash flow statement if we already have net income?", "exp": "Things like depreciation and changes in receivables or inventory make profit and cash different. The cash flow statement shows how much cash actually came in and went out.", "hint": null, "options": ["Net income includes non-cash items and timing differences, so it isn't the same as cash", "Net income is only used for tax purposes", "The cash flow statement shows the share price", "Net income is always higher than cash"], "answer": 0}, {"id": "U1-3.2", "step": "Spot it", "q": "What are the three sections of the cash flow statement?", "exp": "Operating is cash from running the business, investing is buying or selling long-term assets like equipment, and financing is debt, shares and dividends.", "hint": null, "options": ["Revenue, expenses, taxes", "Operating, investing, financing", "Assets, liabilities, equity", "Current, long-term, other"], "answer": 1}, {"id": "U1-3.3", "step": "Spot it", "q": "Where does buying new equipment (capex) show up on the cash flow statement?", "exp": "Capex is spending on long-term assets, so it goes in cash flow from investing.", "hint": null, "options": ["Operating", "Investing", "Financing", "It doesn't show up"], "answer": 1}, {"id": "U1-3.4", "step": "Single step", "q": "Accounts receivable goes up by $20. What happens to cash flow from operations?", "exp": "The company recorded $20 of sales but hasn't collected the cash yet. On the cash flow statement you subtract the increase, so operating cash flow falls $20.", "hint": "Did the customer actually pay?", "options": ["Up $20", "Down $20", "No change", "Down $15"], "answer": 1}, {"id": "U1-3.5", "step": "Spot it", "q": "Which of these is a financing activity?", "exp": "Dividends go to shareholders, so they're financing. Buying a factory is investing; collecting from customers and paying taxes are operating.", "hint": null, "options": ["Buying a factory", "Collecting from customers", "Paying a dividend", "Paying income taxes"], "answer": 2}, {"id": "U1-3.6", "step": "Concept", "q": "Why do we add depreciation back on the cash flow statement?", "exp": "Net income already had depreciation subtracted. Since it's non-cash, you add it back to get to real cash.", "hint": null, "options": ["It lowered net income, but no cash actually left the company", "Depreciation is a type of revenue", "To make cash flow look bigger", "Because depreciation is paid at year end"], "answer": 0}]}, {"id": "u1l4", "title": "Linking the 3 statements", "questions": [{"id": "U1-4.1", "step": "Concept", "q": "Where does the ending cash from the cash flow statement go?", "exp": "Beginning cash plus the net change in cash from the cash flow statement gives ending cash, which is the cash line on the balance sheet.", "hint": null, "options": ["Revenue on the income statement", "Cash on the balance sheet", "Retained earnings", "It doesn't go anywhere"], "answer": 1}, {"id": "U1-4.2", "step": "Concept", "q": "How is ending retained earnings calculated?", "exp": "Profits the company keeps add to retained earnings, and profits paid to shareholders as dividends come off.", "hint": null, "options": ["Beginning retained earnings + net income − dividends", "Revenue − expenses", "Assets − liabilities − cash", "Beginning retained earnings + dividends"], "answer": 0}, {"id": "U1-4.3", "step": "Single step", "q": "A company pays a $5 dividend. What happens?", "exp": "Dividends aren't an expense, so the income statement doesn't change. Cash goes down $5 in financing, and retained earnings go down $5, so the balance sheet still balances.", "hint": "Is a dividend an expense?", "options": ["Net income falls $5", "Cash falls $5 and retained earnings fall $5; the income statement is unaffected", "Cash falls $5 and debt rises $5", "Nothing, dividends are optional"], "answer": 1}, {"id": "U1-4.4", "step": "Concept", "q": "If you could only look at one statement to judge a company's health, which do interviewers usually expect you to pick?", "exp": "The cash flow statement shows how much real cash the business generates and where it goes, which is hard to fake. Mention why you'd still want the others.", "hint": "Which one shows real cash?", "options": ["Income statement", "Balance sheet", "Cash flow statement", "None, you always need all three"], "answer": 2}, {"id": "U1-4.5", "step": "Say it out loud", "q": "Walk me through how the three financial statements link together.", "exp": "Model answer: Net income from the bottom of the income statement is the first line of the cash flow statement. You adjust it for non-cash items like depreciation and for changes in working capital to get cash from operations, then add investing and financing cash flows to get the net change in cash. That change plus beginning cash is the cash on the balance sheet. Net income also flows into retained earnings in equity, and the other balance sheet changes, like PP&E from capex and depreciation, or debt from borrowing, match lines on the cash flow statement. That's why assets still equal liabilities plus equity.", "hint": "Start at net income and follow the cash."}]}, {"id": "u1l5", "title": "Single-step changes", "questions": [{"id": "U1-5.1", "step": "Single step", "q": "Depreciation goes up by $10. The tax rate is 25%. What happens to net income?", "exp": "Pre-tax income falls $10, which lowers taxes by 25% × 10 = $2.50. So net income falls 10 − 2.50 = $7.50.", "hint": "Taxes go down too.", "options": ["Down $10", "Down $7.50", "Down $2.50", "No change"], "answer": 1}, {"id": "U1-5.2", "step": "Single step", "q": "Same change: depreciation up $10, 25% tax rate. What happens to cash?", "exp": "Net income is down $7.50, but you add back the $10 of depreciation because it's non-cash. −7.50 + 10 = +$2.50. Cash rises because the company pays less tax.", "hint": "Start with net income, then add back the non-cash part.", "options": ["Down $10", "Down $7.50", "Up $2.50", "No change"], "answer": 2}, {"id": "U1-5.3", "step": "Single step", "q": "Same change: depreciation up $10, 25% tax rate. How does the balance sheet still balance?", "exp": "Assets fall $7.50 in total (PP&E −10, cash +2.50). On the other side, net income was down $7.50, so retained earnings and equity fall $7.50. Both sides drop by the same amount.", "hint": null, "options": ["PP&E down $10 and cash up $2.50, so assets are down $7.50; retained earnings down $7.50", "Cash down $10 and debt down $10", "PP&E up $10 and equity up $10", "Only cash changes"], "answer": 0}, {"id": "U1-5.4", "step": "Single step", "q": "A company buys $100 of equipment with cash. What happens on the income statement right away?", "exp": "Nothing on the income statement yet. Cash falls $100 in investing, and PP&E rises $100 on the balance sheet. The cost hits the income statement later through depreciation.", "hint": null, "options": ["Expenses up $100", "Net income down $75", "Nothing", "Revenue down $100"], "answer": 2}, {"id": "U1-5.5", "step": "Single step", "q": "A company buys $10 of inventory with cash and hasn't sold it yet. What happens to cash flow from operations?", "exp": "Buying inventory uses cash, and it shows up as an increase in inventory under working capital, so operating cash flow is down $10. Nothing hits the income statement until it's sold.", "hint": null, "options": ["Up $10", "Down $10", "No change", "Down $7.50"], "answer": 1}, {"id": "U1-5.6", "step": "Single step", "q": "A company borrows $50 of new debt. What happens before any interest is paid?", "exp": "Borrowing isn't income. Cash rises $50 in financing, and debt rises $50 as a liability, so the balance sheet balances. Interest expense comes later.", "hint": null, "options": ["Net income up $50", "Cash up $50 and debt up $50; no change to the income statement", "Cash up $50 and equity up $50", "Nothing"], "answer": 1}, {"id": "U1-5.7", "step": "Say it out loud", "q": "Walk me through the three statements when depreciation goes up by $10. Assume a 25% tax rate.", "exp": "Model answer: On the income statement, pre-tax income falls $10, and at a 25% tax rate net income falls $7.50. On the cash flow statement, net income is down $7.50, but you add back the $10 of depreciation since it's non-cash, so cash is up $2.50. On the balance sheet, cash is up $2.50 and PP&E is down $10, so assets are down $7.50. Retained earnings are down $7.50 from the lower net income, so liabilities plus equity are also down $7.50 and it balances.", "hint": "Go income statement, then cash flow, then balance sheet."}]}, {"id": "u1l6", "title": "Multi-step scenarios", "questions": [{"id": "U1-6.1", "step": "Multi-step", "q": "A company buys $50 of inventory on credit (accounts payable). What happens to cash?", "exp": "Inventory up $50 lowers operating cash flow by $50, but accounts payable up $50 raises it by $50. Net change in cash is zero. On the balance sheet, inventory and AP are both up $50.", "hint": "The company hasn't paid anyone yet.", "options": ["Down $50", "Up $50", "No change", "Down $37.50"], "answer": 2}, {"id": "U1-6.2", "step": "Multi-step", "q": "It then sells all of that inventory for $80 in cash. Tax rate is 25%. What is net income from the sale?", "exp": "Revenue is $80 and COGS is $50, so pre-tax income is $30. Tax is 25% × 30 = $7.50, so net income is $22.50.", "hint": "Revenue minus COGS, then tax.", "options": ["$80", "$30", "$22.50", "$60"], "answer": 2}, {"id": "U1-6.3", "step": "Multi-step", "q": "From that $80 sale alone, how much does cash change?", "exp": "Start with net income of $22.50, then add $50 because inventory went down. That's +$72.50. Quick check: $80 collected minus $7.50 of tax = $72.50.", "hint": "The company collected $80 but paid some tax.", "options": ["Up $80", "Up $72.50", "Up $22.50", "Up $30"], "answer": 1}, {"id": "U1-6.4", "step": "Multi-step", "q": "A company borrows $100 at 10% interest and uses it to buy equipment that depreciates evenly over 10 years. Tax rate is 25%. What happens to net income in year 1?", "exp": "Interest is 10% × 100 = $10 and depreciation is 100 ÷ 10 = $10, so pre-tax income falls $20. After 25% tax, net income falls $15.", "hint": "Two expenses: interest and depreciation.", "options": ["Down $20", "Down $15", "Down $10", "Down $7.50"], "answer": 1}, {"id": "U1-6.5", "step": "Multi-step", "q": "Same deal, year 1, counting the borrowing and the purchase. No debt is repaid yet. What is the net change in cash?", "exp": "Operating: net income −15 + depreciation 10 = −5. Investing: −100 for the equipment. Financing: +100 from the debt. Total: −5.", "hint": "Add up all three sections.", "options": ["Down $5", "Down $15", "Down $105", "No change"], "answer": 0}, {"id": "U1-6.6", "step": "Say it out loud", "q": "Walk me through the three statements when a company writes down $20 of inventory. Assume a 25% tax rate.", "exp": "Model answer: On the income statement, the $20 write-down is an expense, so pre-tax income falls $20 and net income falls $15. On the cash flow statement, net income is down $15, and you add back the $20 because the write-down is non-cash, so cash is up $5 from lower taxes. On the balance sheet, cash is up $5 and inventory is down $20, so assets are down $15. Retained earnings are down $15, so both sides fall by $15 and it balances.", "hint": "It works just like depreciation."}]}]}, {"unit": 2, "title": "Equity value & EV", "lessons": [{"id": "u2l1", "title": "Equity value", "questions": [{"id": "U2-1.1", "step": "Concept", "q": "What does equity value (market cap) measure?", "exp": "Equity value is share price × diluted shares outstanding. It's only the shareholders' piece, so lenders and other investors aren't included.", "hint": "Whose stake is 'equity'?", "options": ["The value of the whole business to every investor, including lenders", "The value of the company that belongs to its shareholders", "The company's total cash", "The value of the company's assets on the balance sheet"], "answer": 1}, {"id": "U2-1.2", "step": "Calculate", "q": "A company has 50 shares outstanding and its share price is $20. Ignoring options, what is its equity value?", "exp": "Equity value = share price × shares = $20 × 50 = $1,000.", "hint": null, "options": ["$70", "$250", "$1,000", "$2,000"], "answer": 2}, {"id": "U2-1.3", "step": "Concept", "q": "Why do bankers use market equity value instead of book equity from the balance sheet?", "exp": "Book equity is built from past accounting entries, like money raised and profits kept. Market value is what the shares actually trade for, based on expectations about the future.", "hint": null, "options": ["Market value reflects what investors think future cash flows are worth today; book equity is based on historical accounting", "Book equity is always zero", "Market value never changes", "Book equity includes debt"], "answer": 0}, {"id": "U2-1.4", "step": "Spot it", "q": "Which of these can be negative?", "exp": "Book equity goes negative after big losses, or when a company returns more cash through buybacks and dividends than it has earned. Market equity value can't go below zero, because a share price can't.", "hint": null, "options": ["Market equity value", "Book equity (shareholders' equity on the balance sheet)", "Share price", "Number of shares outstanding"], "answer": 1}]}, {"id": "u2l2", "title": "Enterprise value", "questions": [{"id": "U2-2.1", "step": "Concept", "q": "What does enterprise value measure?", "exp": "Enterprise value is the value of the operating business itself, no matter how it's financed. That's why it's used with metrics like EBITDA that belong to every investor.", "hint": null, "options": ["The value of the company's core business to all investors, including lenders and shareholders", "Only the shareholders' stake", "The company's cash minus its debt", "The value of the company's brand"], "answer": 0}, {"id": "U2-2.2", "step": "Concept", "q": "A house is worth $500,000 and has a $400,000 mortgage. Which number is like enterprise value?", "exp": "The full $500,000 price of the house is like enterprise value. Your $100,000 stake after the mortgage is like equity value.", "hint": "What would a buyer pay for the house itself?", "options": ["$100,000", "$400,000", "$500,000", "$900,000"], "answer": 2}, {"id": "U2-2.3", "step": "Calculate", "q": "Equity value is $1,000, debt is $300 and cash is $100. What is enterprise value?", "exp": "Enterprise value = equity value + debt − cash = 1,000 + 300 − 100 = $1,200.", "hint": "Add debt, subtract cash.", "options": ["$1,200", "$1,400", "$800", "$1,300"], "answer": 0}, {"id": "U2-2.4", "step": "Concept", "q": "Why do you subtract cash when calculating enterprise value?", "exp": "Enterprise value is meant to value the operating business. Extra cash sitting on the balance sheet is a non-operating asset, so you take it out.", "hint": null, "options": ["Cash isn't part of the core business, and a buyer effectively gets it back", "Cash is a liability", "Cash is already counted twice", "Because companies always spend all their cash"], "answer": 0}, {"id": "U2-2.5", "step": "Single step", "q": "A company borrows $100 and keeps it all as cash. What happens to enterprise value?", "exp": "Debt goes up $100 and cash goes up $100, so they cancel out. The core business didn't change, so neither did enterprise value. Equity value doesn't change either.", "hint": "Add debt, subtract cash.", "options": ["Up $100", "Down $100", "No change", "Up $200"], "answer": 2}, {"id": "U2-2.6", "step": "Single step", "q": "A company uses $50 of cash to pay off $50 of debt. What happens to enterprise value?", "exp": "Debt falls $50 and cash falls $50, so enterprise value stays the same. Changing how a company is financed doesn't change what the business is worth.", "hint": null, "options": ["Up $50", "Down $50", "No change", "Down $100"], "answer": 2}, {"id": "U2-2.7", "step": "Single step", "q": "A company issues $100 of new shares and keeps the cash. The share price doesn't move. What happens?", "exp": "More shares at the same price means equity value rises $100. But cash also rises $100, which you subtract, so enterprise value stays the same.", "hint": null, "options": ["Equity value up $100, enterprise value up $100", "Equity value up $100, enterprise value no change", "Equity value no change, enterprise value up $100", "Neither changes"], "answer": 1}]}, {"id": "u2l3", "title": "Diluted shares", "questions": [{"id": "U2-3.1", "step": "Concept", "q": "Why do we use diluted shares instead of basic shares for equity value?", "exp": "If employees or investors can turn options or convertibles into shares, the company's value is really split among more shares. Diluted shares capture that.", "hint": null, "options": ["Options and convertible securities could turn into shares, splitting ownership further", "Basic shares are always wrong", "Diluted shares are always smaller", "Regulators require it on the income statement"], "answer": 0}, {"id": "U2-3.2", "step": "Spot it", "q": "The share price is $20. Which of these options would you include in diluted shares?", "exp": "Only in-the-money options count, where the strike is below the share price. Nobody would pay $25 for a share worth $20.", "hint": "Would you pay the strike price?", "options": ["Options with a $25 strike price", "Options with a $10 strike price", "Both", "Neither"], "answer": 1}, {"id": "U2-3.3", "step": "Calculate", "q": "A company has 100 basic shares, a $20 share price and 10 options with a $10 strike. Using the treasury stock method, how many diluted shares are there?", "exp": "If all 10 options are exercised, the company gets 10 × $10 = $100. It uses that to buy back $100 ÷ $20 = 5 shares. So net new shares = 10 − 5 = 5, and diluted shares = 105.", "hint": "The option money buys back some shares.", "options": ["110", "105", "100", "95"], "answer": 1}, {"id": "U2-3.4", "step": "Calculate", "q": "200 basic shares, $50 share price and 20 options at a $25 strike. What is diluted equity value?", "exp": "Exercise proceeds are 20 × $25 = $500, which buys back $500 ÷ $50 = 10 shares. Net new shares = 20 − 10 = 10, so diluted shares are 210. Diluted equity value = 210 × $50 = $10,500.", "hint": "First find diluted shares, then multiply by the price.", "options": ["$10,000", "$10,500", "$11,000", "$9,500"], "answer": 1}]}, {"id": "u2l4", "title": "The EV bridge", "questions": [{"id": "U2-4.1", "step": "Spot it", "q": "Going from equity value to enterprise value, which of these do you ADD?", "exp": "You add other investors' claims on the business: debt, preferred stock and noncontrolling interests. You subtract non-operating assets like cash and equity investments.", "hint": "Is it another investor's claim, or an extra asset?", "options": ["Cash", "Preferred stock", "Equity investments in other companies", "None of these"], "answer": 1}, {"id": "U2-4.2", "step": "Spot it", "q": "Going from equity value to enterprise value, which of these do you SUBTRACT?", "exp": "Cash is a non-operating asset, so it comes off. Debt, preferred stock and noncontrolling interests are all added.", "hint": null, "options": ["Debt", "Preferred stock", "Noncontrolling interests", "Cash"], "answer": 3}, {"id": "U2-4.3", "step": "Concept", "q": "Why do you add noncontrolling interests when calculating enterprise value?", "exp": "If a company owns 70% of a subsidiary, it still includes 100% of that subsidiary's EBITDA. Adding the 30% owned by others keeps EV and EBITDA on the same basis.", "hint": "Make the value match the metric.", "options": ["The company reports 100% of a subsidiary's EBITDA even though it owns less, so EV has to include the part it doesn't own", "Noncontrolling interests are a type of cash", "To make the company look bigger", "Because noncontrolling interests are tax-deductible"], "answer": 0}, {"id": "U2-4.4", "step": "Concept", "q": "Why do you subtract equity investments (stakes in companies it doesn't control) when calculating enterprise value?", "exp": "When a company owns a minority stake, say 20%, that company's revenue and EBITDA aren't included in its own. Subtracting the investment keeps EV matched to EBITDA.", "hint": null, "options": ["Their earnings aren't included in the company's EBITDA, so their value shouldn't be in EV either", "They are a type of debt", "They are always worth zero", "Because they're on the income statement"], "answer": 0}, {"id": "U2-4.5", "step": "Calculate", "q": "Equity value $800, debt $300, preferred stock $50, noncontrolling interests $30, cash $100, equity investments $20. What is enterprise value?", "exp": "Add the claims: 800 + 300 + 50 + 30 = 1,180. Subtract non-operating assets: 1,180 − 100 − 20 = $1,060.", "hint": "Add debt, preferred and NCI; subtract cash and investments.", "options": ["$1,060", "$1,300", "$1,180", "$1,100"], "answer": 0}]}, {"id": "u2l5", "title": "Which multiple to use", "questions": [{"id": "U2-5.1", "step": "Concept", "q": "Why is EBITDA paired with enterprise value, not equity value?", "exp": "Match the numerator and the denominator. EBITDA is earned before lenders get paid, so it belongs to all investors, which is enterprise value.", "hint": "Who gets paid out of EBITDA?", "options": ["EBITDA is before interest, so it's available to all investors, and EV is the value to all investors", "Because EBITDA is always bigger than net income", "It's just a tradition with no reason", "Because equity value can't be calculated"], "answer": 0}, {"id": "U2-5.2", "step": "Spot it", "q": "Which metric should be paired with equity value?", "exp": "Net income is after interest has been paid to lenders, so it belongs only to shareholders. That's why P/E uses equity value (share price), not enterprise value.", "hint": null, "options": ["EBITDA", "Revenue", "Net income", "EBIT"], "answer": 2}, {"id": "U2-5.3", "step": "Concept", "q": "Why do bankers often prefer EV/EBITDA over P/E when comparing companies?", "exp": "Two companies with the same business but different amounts of debt will have different net incomes, but similar EBITDA. EV/EBITDA lets you compare the businesses themselves.", "hint": null, "options": ["It isn't affected by how each company is financed or by different tax situations", "It's always a smaller number", "Net income can't be found for public companies", "P/E is illegal to use"], "answer": 0}, {"id": "U2-5.4", "step": "Calculate", "q": "Enterprise value is $1,200 and EBITDA is $150. What is the EV/EBITDA multiple?", "exp": "1,200 ÷ 150 = 8.0x.", "hint": null, "options": ["6.0x", "8.0x", "10.0x", "12.0x"], "answer": 1}, {"id": "U2-5.5", "step": "Say it out loud", "q": "What's the difference between equity value and enterprise value?", "exp": "Model answer: Equity value is the value of the company that belongs to shareholders, so diluted shares times the share price. Enterprise value is the value of the core business to all investors, including lenders and preferred shareholders. To get from equity value to enterprise value, you add debt, preferred stock and noncontrolling interests, and subtract cash and other non-operating assets. Enterprise value goes with metrics before interest, like EBITDA, and equity value goes with metrics after interest, like net income.", "hint": "Who each one belongs to, then the bridge."}, {"id": "U2-5.6", "step": "Say it out loud", "q": "If a company raises debt and keeps the money as cash, what happens to its equity value and enterprise value? Why?", "exp": "Model answer: Neither changes. Equity value stays the same because the share price and share count don't move. Enterprise value also stays the same, because debt goes up and cash goes up by the same amount, and you add one and subtract the other. The core business hasn't changed, only how it's financed.", "hint": null}]}]}];
const KEY = "leveraged-learn-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S = Object.assign({xp:0,streak:0,last:null,done:{}}, load());
const app = document.getElementById("app");

function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) n.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function liveStreak(){
  if(!S.last) return 0;
  const y=new Date(); y.setDate(y.getDate()-1);
  return (S.last===todayStr()||S.last===todayStr(y)) ? S.streak : 0;
}
function bumpStreak(){
  const t=todayStr(); const y=new Date(); y.setDate(y.getDate()-1);
  if(S.last===t) return;
  S.streak = (S.last===todayStr(y)) ? S.streak+1 : 1;
  S.last = t;
}
function header(){
  return el("header",{},el("div",{class:"brand"},"Leveraged"),
    el("nav",{"aria-label":"Main"},
      el("a",{href:"index.html"},"Today"),
      el("a",{href:"learn.html",class:"on","aria-current":"page"},"Learn"),
      el("a",{href:"archive.html"},"Archive")));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- Home ----------
function home(){
  app.replaceChildren();
  app.append(header(), el("h1",{},"Learn"),
    el("div",{class:"stats"},
      el("span",{class:"pill fire"},"🔥 ", String(liveStreak()), "-day streak"),
      el("span",{class:"pill xp"},"⚡ ", String(S.xp), " XP")));
  let nextMarked=false;
  for(const u of DATA){
    const total=u.lessons.length, done=u.lessons.filter(l=>S.done[l.id]).length;
    const box=el("section",{class:"unit","aria-label":"Unit "+u.unit},
      el("div",{class:"unit-h"},el("b",{},"Unit "+u.unit+" · "+u.title),el("span",{},done+" of "+total+" done")),
      el("div",{class:"bar","aria-hidden":"true"},el("div",{style:"width:"+Math.round(done/total*100)+"%"})));
    u.lessons.forEach((l,i)=>{
      const isDone=!!S.done[l.id];
      let cls="dot", mark=String(i+1), sub=l.questions.length+" questions";
      if(isDone){cls+=" done"; mark="✓"; sub="Done · practice again";}
      else if(!nextMarked){cls+=" next"; nextMarked=true; sub="Up next · "+l.questions.length+" questions";}
      box.append(el("button",{class:"lesson",type:"button",onclick:()=>startLesson(u,l)},
        el("span",{class:cls,"aria-hidden":"true"},mark),
        el("span",{},el("div",{class:"t"},l.title),el("div",{class:"s"},sub))));
    });
    app.append(box);
  }
  app.append(el("footer",{},"Progress is saved on this device. For education only, not investment advice."));
  window.scrollTo(0,0);
}

// ---------- Lesson ----------
let L=null;
function startLesson(u,l){
  L={u,l,queue:l.questions.map(q=>({q,tries:0})),total:l.questions.length,doneCount:0,firstTry:0,xp:0,picked:null,checked:false,revealed:false};
  renderQ();
}
function renderQ(){
  const item=L.queue[0]; const q=item.q;
  L.picked=null; L.checked=false; L.revealed=false;
  if(q.options && !item.order) item.order=shuffle(q.options.map((t,i)=>i));
  app.replaceChildren();
  app.append(el("div",{class:"top"},
    el("button",{class:"x",type:"button","aria-label":"Quit lesson",onclick:home},"×"),
    el("div",{class:"prog",role:"progressbar","aria-valuemin":"0","aria-valuemax":String(L.total),"aria-valuenow":String(L.doneCount)},
      el("div",{style:"width:"+Math.round(L.doneCount/L.total*100)+"%"}))));
  app.append(el("div",{class:"kicker"},L.l.title+" · "+q.step), el("div",{class:"q"},q.q));
  const foot=el("div",{class:"foot"}); const fin=el("div",{class:"in"}); foot.append(fin);

  if(q.options){
    const list=el("div",{role:"radiogroup","aria-label":"Answer choices"});
    item.order.forEach((oi,pos)=>{
      const b=el("button",{class:"opt",type:"button",role:"radio","aria-checked":"false",onclick:()=>{
        if(L.checked) return; L.picked=oi;
        list.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});
        b.classList.add("sel"); b.setAttribute("aria-checked","true"); check.disabled=false;
      }}, el("span",{class:"k"},String(pos+1)), q.options[oi]);
      b.dataset.i=oi; list.append(b);
    });
    app.append(list);
    if(q.hint){
      const h=el("p",{class:"hint",hidden:true},"Hint: "+q.hint);
      app.append(el("button",{class:"hintbtn",type:"button",onclick:(e)=>{h.hidden=false;e.target.remove()}},"Need a hint?"),h);
    }
    const check=el("button",{class:"btn",type:"button",disabled:true,onclick:()=>{
      if(!L.checked){
        L.checked=true; const right=L.picked===q.answer;
        list.querySelectorAll(".opt").forEach(x=>{x.disabled=true; const i=+x.dataset.i;
          if(i===q.answer) x.classList.add("right"); else if(i===L.picked) x.classList.add("wrong");});
        foot.className="foot "+(right?"ok":"bad");
        fin.prepend(el("div",{class:"verdict"},right?(item.tries===0?"Nice! +10 XP":"Got it this time. +5 XP"):"Not quite."),
                    el("p",{class:"exp"},q.exp));
        if(right){L.xp+=item.tries===0?10:5; if(item.tries===0)L.firstTry++;}
        check.textContent="Continue"; if(!right) check.classList.add("red");
        L.lastRight=right;
      } else { next(L.lastRight); }
    }},"Check");
    fin.append(check);
  } else {
    app.append(el("label",{class:"lbl",for:"ans"},"Say it out loud, or type your answer"),
               el("textarea",{id:"ans",placeholder:"Your answer…"}));
    if(q.hint) app.append(el("p",{class:"hint"},"Tip: "+q.hint));
    const reveal=el("button",{class:"btn",type:"button",onclick:()=>{
      app.append(el("div",{class:"model"},el("b",{},"Model answer: "),q.exp.replace(/^Model answer( structure)?[^:]*:\s*/i,"")));
      fin.replaceChildren(el("div",{class:"row"},
        el("button",{class:"btn ghost",type:"button",onclick:()=>{L.xp+=5;next(true)}},"Needs practice"),
        el("button",{class:"btn",type:"button",onclick:()=>{L.xp+=10;L.firstTry++;next(true)}},"Nailed it")));
      window.scrollTo(0,document.body.scrollHeight);
    }},"Show model answer");
    fin.append(reveal);
  }
  app.append(foot);
  window.scrollTo(0,0);
}
function next(right){
  const item=L.queue.shift();
  if(right){L.doneCount++;}
  else {item.tries++; L.queue.push(item);}   // missed questions come back at the end
  if(L.queue.length) renderQ(); else finish();
}
function finish(){
  const bonus=20; L.xp+=bonus; S.xp+=L.xp; S.done[L.l.id]=true; bumpStreak(); save();
  const acc=Math.round(L.firstTry/L.total*100);
  app.replaceChildren(header(), el("div",{class:"done-card"},
    el("div",{class:"kicker"},"Lesson complete"),
    el("div",{class:"big"},"+"+L.xp+" XP"),
    el("p",{class:"muted"},acc+"% right on the first try · includes +"+bonus+" XP lesson bonus"),
    el("p",{class:"muted"},"🔥 "+liveStreak()+"-day streak")),
    el("button",{class:"btn",type:"button",onclick:home},"Back to Learn"));
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
