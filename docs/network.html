<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Leveraged: Network</title>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0D12;--card:#131820;--card2:#1A202B;--ink:#F3F5F8;--muted:#98A1B0;--line:#232B37;--line2:#2F3846;--g:#3DDC97;--gd:#1A8A5B;--red:#FF6B5E;--orange:#FF9A5C;--gold:#E3B341}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--g)}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
.appbar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.pill{font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--g);opacity:.8}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--g)}
h1{font-size:28px;line-height:1.15;letter-spacing:-.8px;margin:8px 0 8px}
.sub{color:#B9C0CC;margin:0 0 16px;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.input{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:16px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--g)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#98A1B0 50%),linear-gradient(135deg,#98A1B0 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
.btn{width:100%;min-height:52px;border:0;border-radius:16px;font-size:15px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;background:var(--g);color:#06140E;box-shadow:0 5px 0 var(--gd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2);box-shadow:0 5px 0 #0F131A}
.link{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;padding:10px 2px;text-decoration:underline;text-underline-offset:3px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tr{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;padding:6px}
.tr[aria-pressed="true"]{border-color:var(--g);background:rgba(61,220,151,.1);color:var(--g)}
.me{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--g);flex-shrink:0}
.av.sm{width:38px;height:38px;font-size:14px}
.me .nm{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.me .meta{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.st{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.st .v{font-family:'Geist Mono',Geist,monospace;font-size:20px;font-weight:700}
.st .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:22px 0 14px;padding:2px}
.segs::-webkit-scrollbar{display:none}
.seg{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;min-height:40px}
.seg[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.ph h2{font-size:19px;letter-spacing:-.3px;margin:0}
.ph span{font-size:13px;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.mine{background:rgba(61,220,151,.06);margin:0 -14px;padding:12px 14px;border-radius:12px}
.rk{font-family:'Geist Mono',Geist,monospace;font-weight:700;width:28px;text-align:center;color:var(--muted)}
.rk.top{color:var(--gold)}
.who{flex:1;min-width:0}
.who .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{font-family:'Geist Mono',Geist,monospace;font-weight:700;font-size:15px;white-space:nowrap}
.xp small{font-size:11px;color:var(--muted);font-family:Geist,sans-serif;font-weight:600}
.empty{color:var(--muted);font-size:15px;padding:18px 4px;text-align:center}
.mini{min-height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);font-size:13px;font-weight:700;cursor:pointer}
.mini.on{background:var(--g);border-color:var(--g);color:#06140E}
.fl{display:inline-flex;align-items:center;gap:3px;color:#FF8A3D;font-weight:700;font-size:13px}
.search{display:flex;gap:8px;margin:0 0 12px}
.call{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.call .q{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin:6px 0 4px}
.call .qs{font-size:14px;color:var(--muted);margin:0 0 18px}
.ud{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ub{min-height:72px;border-radius:18px;border:1px solid var(--line2);background:var(--bg);font-size:18px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .08s}
.ub:active{transform:scale(.97)}
.ub.up{color:var(--g)}.ub.down{color:var(--orange)}
.ub.chosen.up{background:rgba(61,220,151,.12);border-color:var(--g)}
.ub.chosen.down{background:rgba(255,154,92,.12);border-color:var(--orange)}
.ub small{font-size:12px;font-weight:600;color:var(--muted)}
.res{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.res.right{color:var(--g);background:rgba(61,220,151,.12)}.res.wrong{color:var(--orange);background:rgba(255,154,92,.12)}.res.pending{color:var(--muted);background:var(--card2)}
.soon{margin-top:22px;background:var(--card);border:1px dashed var(--line2);border-radius:20px;padding:16px 18px}
.soon h3{margin:0 0 4px;font-size:16px}.soon p{margin:0;font-size:14px;color:var(--muted)}
.lev{width:96px;margin:0 auto 4px;display:block}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;z-index:40;animation:rise .25s ease;max-width:90vw;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--g);animation:sp 0.8s linear infinite;margin:40px auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,13,18,.86);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:48px;justify-content:center;text-decoration:none;color:#7D8594;font-size:11px;font-weight:600}
.tabbar a.on{color:var(--ink)}.tabbar a.on svg{color:var(--g)}
footer{color:#6E7684;font-size:12px;margin:26px 2px 0;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://dhgkaxebqwqoqdjmrkqi.supabase.co";
const SB_KEY = "sb_publishable_vXGHGR5nhC8sl6qeEr0rKw_339O-zOh";
const LOCAL_KEY = "leveraged-learn-v1";
const SCHOOLS = ["Wilfrid Laurier (Lazaridis)","Waterloo","Western (Ivey)","Queen's (Smith)","Toronto (Rotman)","York (Schulich)","McGill (Desautels)","UBC (Sauder)","TMU (Ted Rogers)","McMaster (DeGroote)","Ottawa (Telfer)","Carleton (Sprott)","Concordia (John Molson)","Alberta","Calgary (Haskayne)","Guelph (Lang)","Brock (Goodman)","Dalhousie (Rowe)","Other"];
const TRACKS = {ib:"IB & Markets", consulting:"Consulting", accounting:"Accounting"};

let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); } catch (e) { sb = null; }

const app = document.getElementById("app");
let me = null, profile = null, tab = "league";

// ---------- helpers ----------
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
function toast(t){ const x = el("div", {class:"toast", role:"status"}, t); document.body.append(x); setTimeout(() => x.remove(), 2600); }
function initials(n){ return (n || "?").replace(/\(.*?\)/g, "").split(/\s+/).map(w => (w.match(/[A-Za-z0-9]/) || [""])[0]).filter(Boolean).slice(0, 2).join("").toUpperCase() || "?"; }
function local(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch (e) { return {}; } }
function saveLocal(s){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch (e) {} }
function torontoNow(){
  const d = new Date();
  const date = new Intl.DateTimeFormat("en-CA", {timeZone:"America/Toronto", year:"numeric", month:"2-digit", day:"2-digit"}).format(d);
  const wd = new Intl.DateTimeFormat("en-US", {timeZone:"America/Toronto", weekday:"short"}).format(d);
  const hr = parseInt(new Intl.DateTimeFormat("en-US", {timeZone:"America/Toronto", hour:"numeric", hourCycle:"h23"}).format(d), 10);
  return {date, weekend: wd === "Sat" || wd === "Sun", hour: hr, wd};
}
function daysLeftInWeek(){ const map = {Mon:7, Tue:6, Wed:5, Thu:4, Fri:3, Sat:2, Sun:1}; return map[torontoNow().wd] || 7; }
function liveStreak(p){
  if (!p || !p.last_active) return 0;
  const t = torontoNow().date, y = new Date(Date.parse(t + "T12:00:00Z") - 864e5).toISOString().slice(0, 10);
  return (p.last_active === t || p.last_active === y) ? p.streak : 0;
}
function lev(){
  return el("span", {class:"lev", "aria-hidden":"true", html:
  `<svg viewBox="0 0 120 112"><path d="M34 34c-12-2-19-10-18-22 5 7 12 11 22 12" fill="none" stroke="#E9EDF2" stroke-width="7" stroke-linecap="round"/><path d="M86 34c12-2 19-10 18-22-5 7-12 11-22 12" fill="none" stroke="#E9EDF2" stroke-width="7" stroke-linecap="round"/><ellipse cx="22" cy="48" rx="10" ry="6.5" fill="#3A4556" transform="rotate(-18 22 48)"/><ellipse cx="98" cy="48" rx="10" ry="6.5" fill="#3A4556" transform="rotate(18 98 48)"/><rect x="26" y="24" width="68" height="78" rx="32" fill="#232B38" stroke="#3A4556" stroke-width="2"/><path d="M52 27c3 4 13 4 16 0" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round"/><circle cx="46" cy="55" r="7.5" fill="#F3F5F8"/><circle cx="47" cy="56" r="4.6" fill="#3DDC97"/><circle cx="47" cy="56" r="2.2" fill="#0A0D12"/><circle cx="48.6" cy="54.2" r="1.3" fill="#fff"/><circle cx="74" cy="55" r="7.5" fill="#F3F5F8"/><circle cx="75" cy="56" r="4.6" fill="#3DDC97"/><circle cx="75" cy="56" r="2.2" fill="#0A0D12"/><circle cx="76.6" cy="54.2" r="1.3" fill="#fff"/><rect x="42" y="70" width="36" height="24" rx="12" fill="#3A4556"/><circle cx="52" cy="80" r="2.6" fill="#0A0D12"/><circle cx="68" cy="80" r="2.6" fill="#0A0D12"/><path d="M54 87c3 3 9 3 12 0" fill="none" stroke="#0A0D12" stroke-width="2.4" stroke-linecap="round"/></svg>`});
}
function spinner(){ return el("div", {class:"spin", role:"status", "aria-label":"Loading"}); }

// ---------- boot ----------
async function boot(){
  if (!sb) {
    app.replaceChildren(el("section", {class:"hero center"}, lev(), el("h1", {}, "Network is offline"), el("p", {class:"sub"}, "We couldn't reach the Network service. Check your connection and refresh.")));
    return;
  }
  const { data } = await sb.auth.getSession();
  me = data && data.session ? data.session.user : null;
  sb.auth.onAuthStateChange((event, session) => {
    const u = session ? session.user : null;
    if ((u && !me) || (!u && me) || (u && me && u.id !== me.id)) { me = u; route(); }
  });
  route();
}

async function route(){
  app.replaceChildren(spinner());
  if (!me) return renderSignIn();
  const { data, error } = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle();
  if (error) { toast("Couldn't load your profile. Try refreshing."); }
  profile = data || null;
  if (!profile) return renderSetup();
  await syncLocal();
  renderHome();
}

// Copy XP and finished lessons from this device into the account (once), and keep them in step
async function syncLocal(){
  const s = local();
  try {
    if (profile.xp_total === 0 && (s.xp || 0) > 0) {
      const r = await sb.rpc("award_xp", {p_amount: Math.min(s.xp, 20000), p_source: "import"});
      if (!r.error && r.data) profile = r.data;
    }
    const { data: prog } = await sb.from("user_progress").select("done").eq("user_id", me.id).maybeSingle();
    const merged = Object.assign({}, (prog && prog.done) || {}, s.done || {});
    await sb.from("user_progress").upsert({user_id: me.id, done: merged, updated_at: new Date().toISOString()});
    s.done = merged;
    s.xp = Math.max(s.xp || 0, profile.xp_total || 0);
    if (profile.track && !s.track) s.track = profile.track;
    saveLocal(s);
  } catch (e) { /* not critical */ }
}

// ---------- sign in ----------
function renderSignIn(sent){
  document.getElementById("pill").textContent = "Network";
  if (sent) {
    app.replaceChildren(el("section", {class:"hero center"}, lev(),
      el("div", {class:"eyebrow"}, "Check your inbox"),
      el("h1", {}, "We sent you a sign-in link"),
      el("p", {class:"sub"}, "Open the email from Supabase on this device and tap the link. It brings you straight back here, signed in."),
      el("button", {class:"link", type:"button", onclick: () => renderSignIn(false)}, "Use a different email")));
    return;
  }
  const email = el("input", {class:"input", id:"email", type:"email", autocomplete:"email", inputmode:"email", placeholder:"you@school.ca", required:true});
  const err = el("div", {class:"err", role:"alert"});
  const btn = el("button", {class:"btn", type:"submit"}, "Send me a sign-in link");
  const form = el("form", {onsubmit: async (ev) => {
    ev.preventDefault(); err.textContent = "";
    const v = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { err.textContent = "Enter a valid email address."; return; }
    btn.disabled = true; btn.textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({email: v, options: {emailRedirectTo: location.origin + location.pathname}});
    btn.disabled = false; btn.textContent = "Send me a sign-in link";
    if (error) { err.textContent = /rate|security/i.test(error.message) ? "Too many tries. Wait a minute and try again." : "Couldn't send the link: " + error.message; return; }
    renderSignIn(true);
  }}, el("div", {class:"field"}, el("label", {for:"email"}, "Email"), email), err, btn);
  app.replaceChildren(
    el("section", {class:"hero"}, el("div", {class:"eyebrow"}, "Network"),
      el("h1", {}, "Compete, compare and keep each other going"),
      el("p", {class:"sub"}, "Weekly leagues, school rankings, friends and a daily market call. Sign in with your email, no password needed."),
      form),
    el("div", {class:"soon"}, el("h3", {}, "Your progress comes with you"), el("p", {}, "XP and finished lessons on this device are added to your account when you sign up.")));
}

// ---------- first-time profile ----------
function renderSetup(){
  document.getElementById("pill").textContent = "Set up";
  const s = local();
  let track = s.track || "ib";
  const name = el("input", {class:"input", id:"dn", maxlength:"40", autocomplete:"name", placeholder:"Jack L."});
  const user = el("input", {class:"input", id:"un", maxlength:"20", autocapitalize:"none", autocomplete:"username", placeholder:"jack_l"});
  const school = el("select", {class:"input", id:"sc"}, el("option", {value:""}, "Choose your school"), SCHOOLS.map(x => el("option", {value:x}, x)));
  const other = el("input", {class:"input", id:"so", maxlength:"80", placeholder:"School name", hidden:true});
  school.addEventListener("change", () => { other.hidden = school.value !== "Other"; });
  const club = el("input", {class:"input", id:"cl", maxlength:"80", placeholder:"e.g. Laurier Accounting Association"});
  const trackBtns = Object.entries(TRACKS).map(([k, v]) => el("button", {class:"tr", type:"button", "aria-pressed": k === track ? "true" : "false", onclick: (e) => {
    track = k; e.currentTarget.parentNode.querySelectorAll(".tr").forEach(b => b.setAttribute("aria-pressed", b === e.currentTarget ? "true" : "false"));
  }}, v));
  user.addEventListener("input", () => { user.value = user.value.toLowerCase().replace(/[^a-z0-9_]/g, ""); });
  const err = el("div", {class:"err", role:"alert"});
  const btn = el("button", {class:"btn", type:"submit"}, "Join the network");
  const form = el("form", {onsubmit: async (ev) => {
    ev.preventDefault(); err.textContent = "";
    const dn = name.value.trim(), un = user.value.trim();
    const sc = school.value === "Other" ? other.value.trim() : school.value;
    if (!dn) { err.textContent = "Add your name."; return; }
    if (!/^[a-z0-9_]{3,20}$/.test(un)) { err.textContent = "Usernames are 3-20 characters: letters, numbers or _."; return; }
    if (!sc) { err.textContent = "Choose your school so you can count toward its ranking."; return; }
    btn.disabled = true; btn.textContent = "Saving…";
    const { error } = await sb.from("profiles").insert({id: me.id, display_name: dn, username: un, school: sc, club: club.value.trim() || null, track});
    btn.disabled = false; btn.textContent = "Join the network";
    if (error) { err.textContent = error.code === "23505" ? "That username is taken. Try another." : "Couldn't save: " + error.message; return; }
    const st = local(); st.track = track; saveLocal(st);
    route();
  }},
    el("div", {class:"field"}, el("label", {for:"dn"}, "Name"), name, el("span", {class:"hint"}, "Shown on leaderboards.")),
    el("div", {class:"field"}, el("label", {for:"un"}, "Username"), user, el("span", {class:"hint"}, "Friends find you with this.")),
    el("div", {class:"field"}, el("label", {for:"sc"}, "School"), school, other),
    el("div", {class:"field"}, el("label", {}, "Track"), el("div", {class:"tracks", role:"group", "aria-label":"Track"}, trackBtns)),
    el("div", {class:"field"}, el("label", {for:"cl"}, "Club (optional)"), club),
    err, btn);
  app.replaceChildren(el("section", {class:"hero"}, el("div", {class:"eyebrow"}, "Almost there"), el("h1", {}, "Set up your profile"), form),
    el("button", {class:"link", type:"button", onclick: async () => { await sb.auth.signOut(); }}, "Sign out"));
}

// ---------- signed-in home ----------
function renderHome(){
  document.getElementById("pill").textContent = "@" + profile.username;
  const head = el("section", {class:"hero"},
    el("div", {class:"me"}, el("div", {class:"av"}, initials(profile.display_name)),
      el("div", {}, el("div", {class:"nm"}, profile.display_name), el("div", {class:"meta"}, [profile.school, TRACKS[profile.track]].filter(Boolean).join(" · ")))),
    el("div", {class:"stats"},
      el("div", {class:"st"}, el("div", {class:"v"}, String(liveStreak(profile))), el("div", {class:"l"}, "Day streak")),
      el("div", {class:"st"}, el("div", {class:"v"}, String(profile.xp_total)), el("div", {class:"l"}, "Total XP")),
      el("div", {class:"st", id:"myrank"}, el("div", {class:"v"}, "–"), el("div", {class:"l"}, "League rank"))));
  const tabs = [["league", "League"], ["schools", "Schools"], ["friends", "Friends"], ["call", "Market call"]];
  const segs = el("div", {class:"segs", role:"tablist", "aria-label":"Network sections"},
    tabs.map(([k, v]) => el("button", {class:"seg", type:"button", role:"tab", "aria-selected": tab === k ? "true" : "false", onclick: () => { tab = k; renderHome(); }}, v)));
  const body = el("div", {id:"tabbody"}, spinner());
  app.replaceChildren(head, segs, body,
    el("div", {class:"soon"}, el("h3", {}, "Clubs are coming"), el("p", {}, "Club leaders will be able to create a group, run challenges and track members.")),
    el("div", {class:"center"}, el("button", {class:"link", type:"button", onclick: async () => { await sb.auth.signOut(); }}, "Sign out")));
  loadRank();
  ({league: tabLeague, schools: tabSchools, friends: tabFriends, call: tabCall})[tab](body);
}

async function loadRank(){
  const { data } = await sb.rpc("league_week");
  const i = (data || []).findIndex(r => r.user_id === me.id);
  const box = document.querySelector("#myrank .v");
  if (box) box.textContent = i >= 0 ? "#" + (i + 1) : "–";
}

function rowEl(rank, name, sub, right, mine){
  return el("div", {class:"row" + (mine ? " mine" : "")},
    el("div", {class:"rk" + (rank <= 3 ? " top" : "")}, String(rank)),
    el("div", {class:"av sm"}, initials(name)),
    el("div", {class:"who"}, el("div", {class:"n"}, name + (mine ? " (you)" : "")), el("div", {class:"s"}, sub || "")),
    right);
}

async function tabLeague(box){
  const { data, error } = await sb.rpc("league_week");
  const d = daysLeftInWeek();
  const rows = (data || []).map((r, i) => rowEl(i + 1, r.display_name, r.school, el("div", {class:"xp"}, String(r.xp), el("small", {}, " XP")), r.user_id === me.id));
  box.replaceChildren(el("div", {class:"panel"},
    el("div", {class:"ph"}, el("h2", {}, "This week's league"), el("span", {}, "Resets in " + d + " day" + (d === 1 ? "" : "s"))),
    error ? el("div", {class:"empty"}, "Couldn't load the league. Try again soon.") :
    rows.length ? el("div", {class:"list"}, rows) : el("div", {class:"empty"}, "No XP yet this week. Finish a lesson in Learn to take the lead.")));
}

async function tabSchools(box){
  const { data, error } = await sb.rpc("school_week");
  const rows = (data || []).map((r, i) => rowEl(i + 1, r.school, r.members + " active member" + (r.members === 1 ? "" : "s"),
    el("div", {class:"xp"}, String(r.xp), el("small", {}, " XP")), r.school === profile.school));
  box.replaceChildren(el("div", {class:"panel"},
    el("div", {class:"ph"}, el("h2", {}, "School rankings"), el("span", {}, "This week's XP")),
    error ? el("div", {class:"empty"}, "Couldn't load school rankings.") :
    rows.length ? el("div", {class:"list"}, rows) : el("div", {class:"empty"}, "No school has XP yet this week. Put yours on the board.")));
}

async function tabFriends(box){
  const [{ data: fr }, { data: fol }] = await Promise.all([sb.rpc("friends_list"), sb.from("follows").select("followee").eq("follower", me.id)]);
  const following = new Set((fol || []).map(x => x.followee));
  const q = el("input", {class:"input", type:"search", placeholder:"Find a friend by username", autocapitalize:"none", "aria-label":"Find a friend by username"});
  const results = el("div", {});
  async function doSearch(){
    const v = q.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
    if (v.length < 2) { results.replaceChildren(); return; }
    const { data } = await sb.from("profiles").select("id,display_name,username,school").ilike("username", v + "%").neq("id", me.id).limit(8);
    results.replaceChildren(data && data.length ? el("div", {class:"list", style:"margin-bottom:14px"}, data.map(p => {
      const on = following.has(p.id);
      const b = el("button", {class:"mini" + (on ? "" : " on"), type:"button", onclick: async () => {
        if (following.has(p.id)) { await sb.from("follows").delete().eq("follower", me.id).eq("followee", p.id); following.delete(p.id); }
        else { const { error } = await sb.from("follows").insert({follower: me.id, followee: p.id}); if (error) { toast("Couldn't add friend."); return; } following.add(p.id); toast("Added " + p.display_name); }
        tabFriends(box);
      }}, on ? "Remove" : "Add");
      return el("div", {class:"row"}, el("div", {class:"av sm"}, initials(p.display_name)),
        el("div", {class:"who"}, el("div", {class:"n"}, p.display_name), el("div", {class:"s"}, "@" + p.username + (p.school ? " · " + p.school : ""))), b);
    })) : el("div", {class:"empty"}, "No one found with that username."));
  }
  let t = null;
  q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(doSearch, 250); });
  const rows = (fr || []).map((r, i) => el("div", {class:"row"},
    el("div", {class:"av sm"}, initials(r.display_name)),
    el("div", {class:"who"}, el("div", {class:"n"}, r.display_name), el("div", {class:"s"}, "@" + r.username)),
    el("span", {class:"fl", title:"Day streak"}, el("span", {"aria-hidden":"true", html:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 3.2 3.9 5.3 3.9 9.6A3.9 3.9 0 0 1 12 15.5c-2.2 0-3.6-1.6-3.6-3.5 0-1.4.7-2.4 1.6-3.3.1 1.5.8 2.4 1.7 2.4.3-2.6-.8-5.4.3-9.1zM6.2 10.4c-.9 1.3-1.4 2.8-1.4 4.3A7.2 7.2 0 0 0 12 22a7.2 7.2 0 0 0 7.2-7.3c0-1.6-.5-3.1-1.3-4.4-.2 3.6-2.8 6.6-5.9 6.6-3 0-5.6-2.9-5.8-6.5z"/></svg>'}), String(r.streak)),
    el("div", {class:"xp", style:"margin-left:10px"}, String(r.xp_week), el("small", {}, " XP"))));
  box.replaceChildren(el("div", {class:"panel"},
    el("div", {class:"ph"}, el("h2", {}, "Friends"), el("span", {}, "Streaks and this week's XP")),
    el("div", {class:"search"}, q), results,
    rows.length ? el("div", {class:"list"}, rows) : el("div", {class:"empty"}, "Add friends by username to compare streaks and XP.")));
}

async function tabCall(box){
  const now = torontoNow();
  const { data: calls } = await sb.from("market_calls").select("call_date,pick,result").eq("user_id", me.id).order("call_date", {ascending: false}).limit(20);
  const list = calls || [];
  const today = list.find(c => c.call_date === now.date);
  const scored = list.filter(c => c.result);
  const right = scored.filter(c => c.result === "right").length;
  const acc = scored.length ? Math.round(right / scored.length * 100) + "%" : "–";

  let main;
  if (now.weekend) {
    main = el("div", {class:"call"}, el("div", {class:"eyebrow"}, "Daily market call"), el("div", {class:"q"}, "Markets are closed"), el("p", {class:"qs", style:"margin:0"}, "The next call opens Monday morning."));
  } else if (today) {
    main = el("div", {class:"call"}, el("div", {class:"eyebrow"}, "Today's call is in"),
      el("div", {class:"q"}, "You said the S&P 500 closes " + (today.pick === "up" ? "higher" : "lower")),
      el("p", {class:"qs", style:"margin:0"}, "Scored tomorrow morning. Right calls earn 5 XP."));
  } else if (now.hour >= 16) {
    main = el("div", {class:"call"}, el("div", {class:"eyebrow"}, "Daily market call"), el("div", {class:"q"}, "Today's call is closed"), el("p", {class:"qs", style:"margin:0"}, "Calls lock at 4 PM ET. Come back tomorrow."));
  } else {
    const pick = async (p) => {
      const { error } = await sb.from("market_calls").insert({user_id: me.id, call_date: now.date, pick: p});
      if (error) { toast(error.code === "23505" ? "You've already made today's call." : "Couldn't save your call. Calls close at 4 PM ET."); }
      else toast("Call locked in");
      tabCall(box);
    };
    main = el("div", {class:"call"}, el("div", {class:"eyebrow"}, "Daily market call"),
      el("div", {class:"q"}, "Will the S&P 500 close higher or lower today?"),
      el("p", {class:"qs"}, "Lock in before 4 PM ET. Right calls earn 5 XP."),
      el("div", {class:"ud"},
        el("button", {class:"ub up", type:"button", onclick: () => pick("up")}, "▲ Higher", el("small", {}, "Close up")),
        el("button", {class:"ub down", type:"button", onclick: () => pick("down")}, "▼ Lower", el("small", {}, "Close down"))));
  }
  const hist = list.map(c => el("div", {class:"row"},
    el("div", {class:"who"}, el("div", {class:"n"}, new Date(c.call_date + "T12:00:00Z").toLocaleDateString("en-CA", {weekday:"short", month:"short", day:"numeric", timeZone:"UTC"})),
      el("div", {class:"s"}, "You said " + (c.pick === "up" ? "higher" : "lower"))),
    el("span", {class:"res " + (c.result || "pending")}, c.result ? c.result : "pending")));
  box.replaceChildren(el("div", {class:"panel"}, main,
    el("div", {class:"ph", style:"margin-top:22px"}, el("h2", {}, "Your calls"), el("span", {}, "Accuracy " + acc + (scored.length ? " · " + right + "/" + scored.length : ""))),
    hist.length ? el("div", {class:"list"}, hist) : el("div", {class:"empty"}, "Your past calls will show up here.")));
}

boot();
</script>
</body>
</html>
